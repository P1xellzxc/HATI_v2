<title>HATI² Glass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: one phone-width column of ink-bordered panels on flat paper; volumes are numbered spines, lists are ruled ledgers, the balance panel carries screentone. */
:root {
  /* Palette inputs from the chosen Sanzo Wada plate */
  --ink-l: #000000; --paper-l: #FFFFFF; --acc-l: #FEF08A; --acc-d: #FFF3B0;
  --hero-l: #FFF5D6; --hero-d: #3A3422; --food-l: #FFC9A8; --muted-l: #6B7280;
  --b1: #FEF08A; --b2: #BFDBFE; --b3: #BBF7D0; --b4: #E9D5FF;

  /* Light: ink on paper */
  --bg: var(--paper-l);
  --fg: var(--ink-l);
  --sub: var(--muted-l);
  --label: var(--muted-l);
  --panel: var(--paper-l);
  --sunk: color-mix(in srgb, var(--ink-l) 5%, var(--paper-l));
  --line: color-mix(in srgb, var(--ink-l) 22%, var(--paper-l));
  --rule: var(--ink-l);
  --accent: var(--acc-l);
  --on-accent: var(--ink-l);
  --hero: var(--hero-l);
  --chip: var(--food-l);
  --tone: color-mix(in srgb, var(--ink-l) 16%, transparent);
  --pos: #166534; --neg: #9D174D; --err: #B3261E;
  --nav: var(--paper-l);
  /* Strip under the iOS status bar: black-translucent draws white clock text, so it stays dark in every theme (an ink band). */
  --sbar: var(--ink-l);

  --font-disp: 'Black Han Sans', 'Arial Black', Impact, sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 3px;
  /* Manga clay (pressable controls only): one corner, an inner light and an inner shade, mixed from the palette */
  --clay-r: 8px;
  --clay-hi: color-mix(in srgb, var(--paper-l) 70%, transparent);
  --clay-lo: color-mix(in srgb, var(--ink-l) 16%, transparent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131217; --fg: #EDEBE4; --sub: #A8A6B0; --label: #A8A6B0;
    --panel: #1B1A21; --sunk: #17161C; --line: #3A3842; --rule: #EDEBE4;
    --accent: var(--acc-d); --on-accent: #131217; --hero: var(--hero-d);
    --chip: color-mix(in srgb, var(--food-l) 28%, #1B1A21);
    --tone: rgba(237, 235, 228, 0.14);
    --pos: #BBF7D0; --neg: #FBCFE8; --err: #F2B8B5; --nav: #131217; --sbar: #131217;
    --clay-hi: color-mix(in srgb, var(--fg) 10%, transparent); --clay-lo: color-mix(in srgb, var(--bg) 60%, transparent);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131217; --fg: #EDEBE4; --sub: #A8A6B0; --label: #A8A6B0;
  --panel: #1B1A21; --sunk: #17161C; --line: #3A3842; --rule: #EDEBE4;
  --accent: var(--acc-d); --on-accent: #131217; --hero: var(--hero-d);
  --chip: color-mix(in srgb, var(--food-l) 28%, #1B1A21);
  --tone: rgba(237, 235, 228, 0.14);
  --pos: #BBF7D0; --neg: #FBCFE8; --err: #F2B8B5; --nav: #131217; --sbar: #131217;
  --clay-hi: color-mix(in srgb, var(--fg) 10%, transparent); --clay-lo: color-mix(in srgb, var(--bg) 60%, transparent);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; background: var(--bg); }
body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sbar); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; box-shadow: 0 0 0 6px var(--accent); }
h1, h2 { text-wrap: balance; }

#app {
  max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
  min-height: 100%;
}

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 10px; min-height: 66px;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 14px;
  padding: 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--nav); border-bottom: 2px solid var(--rule);
}
.topbar h1 { flex: 1; min-width: 0; margin: 0; font: 400 1.35rem/1.1 var(--font-disp); letter-spacing: .02em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.topbar h1:focus, .topbar h1:focus-visible { outline: none; box-shadow: none; }
.topbar .sub { font-size: .85rem; max-width: 40%; }
@media (max-width: 420px) { .topbar .sub { display: none; } }
.logo { width: 36px; height: 36px; border-radius: var(--r); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 400 .95rem var(--font-disp); flex-shrink: 0; border: 2px solid var(--rule); }
.logo svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; }
.ico { width: 44px; height: 44px; background: var(--panel); border: 2px solid var(--rule); display: grid; place-items: center; flex-shrink: 0; }
.ico svg, .btn svg, .tx-ic svg, .cat svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tagline { margin: 0 0 4px; font-size: .95rem; color: var(--sub); max-width: 34ch; }

/* Generic structure */
.stack { display: flex; flex-direction: column; gap: 12px; }
section { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.panel { background: var(--panel); border: 2px solid var(--rule); border-radius: var(--r); }
.pad { padding: 14px; }
.label { margin: 18px 0 2px; font: 400 1.05rem/1.2 var(--font-disp); letter-spacing: .02em; color: var(--fg); }
section > .label, section > .row > .label { margin-top: 6px; }
.muted { color: var(--sub); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }
:is(span, b, div).num, .money { white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.ellip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.date { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Manga clay: only pressable things are clay. A flat palette fill (no gradients) with an inner light top-left and an
   inner shade bottom-right, the 2px ink outline and the hard 0-blur ink offset. Pressed: the offset drops to 0, the shade
   grows and the body moves 3px (the move is dropped under reduced motion, the shading stays). Reading surfaces stay flat 3px. */
.btn, .ico, .cat, .vol, button.chip:not(.add), .nav button[aria-current="page"] {
  --c-x: 3px; --c-in: 0px; --c-off: var(--rule); --c-hi: var(--clay-hi); --c-lo: var(--clay-lo);
  --clay: inset 2px 2px 3px var(--c-hi), inset -3px -3px 4px var(--c-lo), inset var(--c-in) var(--c-in) calc(2 * var(--c-in)) var(--c-lo), var(--c-x) var(--c-x) 0 var(--c-off);
  border-radius: var(--clay-r); box-shadow: var(--clay); transition: transform .08s, box-shadow .08s;
}
.btn:active, .ico:active, .cat:active, .vol:active, button.chip:not(.add):active { --c-x: 0px; --c-in: 3px; transform: translate(3px, 3px); }
.cat[aria-pressed="true"] { --c-x: 0px; --c-in: 3px; }
.btn {
  min-height: 44px; border: 2px solid var(--rule);
  background: var(--panel); padding: 10px 14px;
  font-weight: 700; font-size: .9rem; line-height: 20px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.quiet, .btn.text { --clay: 0 0 #0000; box-shadow: none; border-radius: var(--r); }
.btn.quiet:active { transform: none; background: var(--sunk); }
.btn.text { border-color: transparent; background: transparent; }
.btn.text:active { transform: none; background: var(--sunk); }
.btn.danger { color: var(--err); border-color: var(--err); --c-off: var(--err); --c-lo: color-mix(in srgb, var(--err) 30%, transparent); }
.btn.block { width: 100%; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btns.acts > :first-child { grid-column: 1 / -1; }
@media (max-width: 360px) { .btns:not(.pair) { grid-template-columns: 1fr; } }

/* Hub: volumes as numbered spines */
.vol { display: grid; grid-template-columns: 64px 1fr; text-align: left; padding: 0; width: 100%; overflow: hidden; background: var(--panel); border: 2px solid var(--rule); }
.spine { box-shadow: inset 2px 2px 3px var(--clay-hi), inset -3px -3px 4px var(--clay-lo); background: var(--accent); color: var(--on-accent); border-right: 2px solid var(--rule); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 10px 4px; }
.spine span { font-size: .68rem; font-weight: 700; letter-spacing: .12em; }
.spine b { font: 400 1.6rem/1 var(--font-disp); }
.vol-info { padding: 12px 14px; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.vol-name { font: 400 1.1rem/1.2 var(--font-disp); letter-spacing: .02em; }
.vol-bal { font-weight: 700; font-size: .95rem; }
.vol-bal.pos { color: var(--pos); } .vol-bal.neg { color: var(--neg); } .vol-bal.even { color: var(--sub); }
.dashed { border: 2px dashed var(--line); border-radius: var(--r); background: transparent; padding: 16px; width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; }
.dashed b { font-size: 1rem; display: block; }

/* Volume: balance panel with screentone */
.hero { position: relative; overflow: hidden; padding: 16px 16px 14px; background: var(--hero); border: 2px solid var(--rule); border-radius: var(--r); box-shadow: 4px 4px 0 var(--rule); }
.hero::after { content: ""; position: absolute; right: -10px; top: -10px; width: 46%; height: 140%; background: radial-gradient(circle, var(--tone) 1.3px, transparent 1.6px) 0 0 / 7px 7px; transform: rotate(8deg); pointer-events: none; -webkit-mask-image: linear-gradient(to left, #000 30%, transparent); mask-image: linear-gradient(to left, #000 30%, transparent); }
.hero > * { position: relative; }
.hero .k { font-weight: 700; font-size: .95rem; }
.hero .amt { font: 400 clamp(1.9rem, 10vw, 2.6rem)/1.1 var(--font-disp); letter-spacing: .01em; margin: 2px 0 6px; }
.hero .amt.long { font-size: 1.6rem; }
.hero .amt.longer { font-size: 1.25rem; }
.hero .meta { font-size: .85rem; color: color-mix(in srgb, var(--fg) 72%, var(--hero)); }
@media (max-width: 379px) { .hero .vno { display: none; } }
.hero .mine { margin: 8px 0 0; padding: 8px 0 0; border-top: 1.5px solid var(--rule); display: flex; flex-direction: column; gap: 4px; font-size: .92rem; list-style: none; }
.amt.pos, .k.pos { color: var(--pos); } .amt.neg, .k.neg { color: var(--neg); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--panel); font-size: .9rem; font-weight: 600; }
.chip .num { font-weight: 500; }
.chip.add { padding: 4px 14px; min-height: 44px; border: 2px dashed var(--line); background: transparent; }
button.chip { min-height: 44px; text-align: left; }
button.chip:not(.add) { border: 2px solid var(--rule); }
button.chip:active { background: var(--sunk); }
.btn:disabled { opacity: .55; --clay: 0 0 #0000; box-shadow: none; cursor: not-allowed; }
.btn:disabled:active { transform: none; }
.av { width: 30px; height: 30px; border-radius: var(--r); display: grid; place-items: center; font-size: .75rem; font-weight: 700; color: var(--on-accent); border: 1.5px solid var(--rule); flex-shrink: 0; }

/* Ledger: ruled rows inside one panel */
.ledger { background: var(--panel); border: 2px solid var(--rule); border-radius: var(--r); display: flex; flex-direction: column; }
.ledger > * + * { border-top: 1px solid var(--line); }
.tx, .debt { display: flex; align-items: center; gap: 12px; padding: 12px; width: 100%; min-height: 56px; text-align: left; background: transparent; border: 0; }
.ledger > .tx + .tx, .ledger > .debt + .debt, .ledger > * + .tx, .ledger > * + .debt { border-top: 1px solid var(--line); }
button.tx:active, button.debt:active { background: var(--sunk); }
.tx-ic { width: 36px; height: 36px; border-radius: var(--r); display: grid; place-items: center; border: 1.5px solid var(--rule); background: var(--sunk); flex-shrink: 0; }
.tx-a { font-weight: 700; white-space: nowrap; }
.who { display: flex; gap: .3em; min-width: 0; white-space: nowrap; }
.who > .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.who > :not(.nm) { flex: none; }
.who > .nm ~ .nm { flex-shrink: 0; max-width: 45%; }
.bars { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.bar { height: 10px; border: 1.5px solid var(--rule); border-radius: 1px; background: var(--panel); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--fg); }
.empty { text-align: center; padding: 20px 16px; background: radial-gradient(circle, var(--tone) 1px, transparent 1.3px) 0 0 / 6px 6px; }
.empty .kao { font: 400 1.3rem var(--font-disp); }
.empty .muted { background: var(--panel); display: inline-block; padding: 2px 8px; margin-top: 4px; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .legend { font-size: .85rem; font-weight: 700; color: var(--fg); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
legend { padding: 0; margin-bottom: 6px; }
.input, select.input, textarea.input { width: 100%; padding: 11px 12px; border-radius: var(--r); font-size: 16px; border: 2px solid var(--line); background: var(--panel); outline: none; -webkit-appearance: none; appearance: none; }
.input:focus { border-color: var(--rule); }
.input[aria-invalid="true"] { border-color: var(--err); }
.input:disabled { background: var(--sunk); color: var(--sub); }
select.input { background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.amount-box { padding: 12px 14px; background: var(--hero); border: 2px solid var(--rule); border-radius: var(--r); }
.amount-box:focus-within { outline: 3px solid var(--fg); outline-offset: 2px; }
.amount-box .row { gap: 6px; }
.amount-box .cur { font: 400 1.6rem var(--font-disp); }
.amount-box input { flex: 1; min-width: 0; min-height: 44px; font: 400 2.2rem/1.1 var(--font-disp); background: transparent; border: none; outline: none; padding: 0; }
.seg { display: flex; flex-wrap: wrap; border: 2px solid var(--rule); border-radius: var(--clay-r); overflow: hidden; box-shadow: 3px 3px 0 var(--rule); }
.seg button { flex: 1 1 auto; min-height: 44px; border: none; background: var(--panel); padding: 8px 4px; font-size: .9rem; font-weight: 700; color: var(--fg); box-shadow: inset 2px 2px 3px var(--clay-hi), inset -3px -3px 4px var(--clay-lo); }
.seg button + button { border-left: 2px solid var(--rule); }
/* Selected segment is pushed in: inverted fill, inner shade only (no inner light) */
.seg button[aria-pressed="true"], .seg button:active { box-shadow: inset 3px 3px 5px var(--clay-lo); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg button:focus-visible { outline: 3px solid currentColor; outline-offset: -7px; box-shadow: inset 3px 3px 5px var(--clay-lo); }
@media (min-width: 350px) { .seg:has(> :nth-child(3)) { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; } }
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cat { border: 2px solid var(--rule); background: var(--panel); padding: 10px 6px; min-height: 60px; font-size: .85rem; font-weight: 600; display: grid; justify-items: center; gap: 4px; }
.cat[aria-pressed="true"] { background: var(--chip); }
.split-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 12px; min-height: 52px; }
.split-row.typed { grid-template-columns: auto minmax(0, 1fr); }
.split-row.typed > .row:last-child { grid-column: 2; justify-content: flex-end; }
.split-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--fg); }
.split-row .share { text-align: right; font-weight: 700; white-space: nowrap; }
.split-row .input { width: 110px; padding: 8px 10px; text-align: right; }
.split-in { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.msg { font-size: .9rem; font-weight: 600; color: var(--err); min-height: 1.2em; }
.msg.ok { color: var(--pos); }
.stack > .msg:empty, .stack > [aria-live]:empty, .stack > #s-pick:empty { min-height: 0; margin-top: -12px; }
.field > .msg:empty { min-height: 0; margin-top: -6px; }

/* Bottom nav */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  display: flex; justify-content: center; gap: 8px;
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--nav); border-top: 2px solid var(--rule);
}
.nav button { flex: 1; max-width: 160px; min-height: 52px; border: 2px solid transparent; background: none; display: grid; justify-items: center; gap: 2px; padding: 4px; border-radius: var(--clay-r); font-size: .78rem; font-weight: 700; color: var(--sub); }
.nav button[aria-current="page"] { color: var(--on-accent); background: var(--accent); border-color: var(--rule); }
.nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(10, 10, 14, 0.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 520px; max-height: min(88%, var(--vvh, 100dvh)); overflow: auto; overscroll-behavior: contain;
  border-radius: 6px 6px 0 0; border: 2px solid var(--rule); border-bottom: none; background: var(--bg);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet h2 { margin: 0 0 12px; font: 400 1.35rem var(--font-disp); letter-spacing: .02em; }
.sheet h2:focus, .sheet h2:focus-visible { outline: none; box-shadow: none; }

/* Settings palettes: a grid of printed swatch plates */
.pals { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px 8px; }
.pal { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 6px 6px 7px; min-height: 64px; border-radius: var(--r); border: 2px solid var(--pi); background: var(--pp); color: var(--pi); text-align: left; }
.pal:first-child { grid-column: 1 / -1; }
.pal[aria-checked="true"] { box-shadow: 3px 3px 0 var(--rule); }
.pal .n { color: var(--pm); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pal { background: var(--panel); color: var(--fg); border-color: var(--line); } :root:not([data-theme="light"]) .pal .n { color: var(--sub); } :root:not([data-theme="light"]) .pal[aria-checked="true"] { border-color: var(--rule); } }
:root[data-theme="dark"] .pal { background: var(--panel); color: var(--fg); border-color: var(--line); }
:root[data-theme="dark"] .pal .n { color: var(--sub); }
:root[data-theme="dark"] .pal[aria-checked="true"] { border-color: var(--rule); }
.sw { display: flex; height: 18px; border: 1.5px solid currentColor; }
.sw i { flex: 1; }
.pal b { font-size: .85rem; line-height: 1.15; overflow-wrap: anywhere; }
.pal .n { font-size: .72rem; font-weight: 600; }
.pal .dot { position: absolute; right: 6px; bottom: 6px; width: 22px; height: 22px; color: var(--pi); border-radius: var(--r); border: 2px solid currentColor; display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
.share-sum { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 2px solid var(--rule); border-radius: var(--r); background: var(--panel); min-width: 0; }
.share-sum b { font: 400 1.1rem/1.2 var(--font-disp); letter-spacing: .02em; }
.codebox summary { min-height: 44px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .9rem; cursor: pointer; list-style: none; }
.codebox summary::-webkit-details-marker { display: none; }
.codebox summary::before { content: ""; width: 0; height: 0; border-left: 6px solid currentColor; border-block: 5px solid transparent; transition: transform .1s; }
.codebox[open] summary::before { transform: rotate(90deg); }
.filepick { flex-wrap: wrap; }
.filepick:focus-within .btn { outline: 3px solid var(--fg); outline-offset: 2px; }
.banner { font-size: .9rem; padding: 10px 12px; margin-top: 12px; }

function computeSplits() {
  const f = ui.form, v = vol(), amount = parseMoney(f.amount);
  const ids = v.members.filter(m => f.include[m.id]).map(m => m.id);
  if (isNaN(amount)) return { error: "Use numbers like 12.50 (up to 2 decimals)." };
  if (!(amount > 0)) return { error: "Enter an amount greater than zero." };
  if (amount > MAX_CENTS) return { error: "That amount is too large." };
  if (!ids.length) return { error: "Pick at least one person to split with." };
  if (f.splitType === "equal") return { splits: splitEqual(amount, ids), amount };
  if (f.splitType === "exact") {
    const out = {}; let sum = 0;
    for (const id of ids) { const c = parseMoney(f.inputs[id] || "0"); if (isNaN(c)) return { error: `Check the amount for ${meName(v, id)}.` }; out[id] = c; sum += c; }
    if (sum !== amount) return { error: sum < amount ? `Exact amounts add up to ${fmt(sum, v.currency)}; ${fmt(amount - sum, v.currency)} left to assign.` : `Exact amounts add up to ${fmt(sum, v.currency)}; that's ${fmt(sum - amount, v.currency)} over.`, partial: out, amount };
    return { splits: out, amount };
  }
  const w = {};
  for (const id of ids) { const x = parseWeight(f.inputs[id] || ""); if (isNaN(x)) return { error: `Check the ${f.splitType === "percent" ? "percent" : "shares"} for ${meName(v, id)}.` }; w[id] = x; }
  const W = Object.values(w).reduce((a, b) => a + b, 0);
  if (f.splitType === "percent" && Math.round(W * 100) !== 10000) return { error: `Percentages add up to ${W.toFixed(2)}%; they need to total 100%.` };
  if (W <= 0) return { error: "Give at least one person a share." };
  return { splits: splitWeighted(amount, w), amount };
}

}

}

  if (r.view === "expense") {
    const v = vol(), e = r.expId ? v.expenses.find(x => x.id === r.expId) : null;
    if (r.expId && !e) ui.view = "volume";
    else ui.form = draftFor(r.expId || null) || formFrom(e);

}
function parentOf() {
  if (ui.view === "expense") return ui.from || "volume";
  if (ui.view === "history") return "volume";
  return "hub";
}
function go(view, { replace = false } = {}) {
  const had = sheetOpen();
  if (had) dropSheet();
  if (view !== "expense" && ui.view === "expense") clearDraft();
  ui.view = view; ui.histLimit = 100;
  setUrl(replace || had);

}
function leave() {
  if (ui.view === "expense") clearDraft();

}
function focusTitle() { const h = $("#app h1"); if (h) h.focus({ preventScroll: true }); }
addEventListener("popstate", () => {
  if (sheetOpen()) { dropSheet(); setUrl(false); return; }
  applyRoute(); render(); window.scrollTo(0, 0); focusTitle();
});

function render() {
  try { $("#app").innerHTML = views[ui.view]() + banner(); }
  catch (e) {
    $("#app").innerHTML = topbar("HATI²") + `<div class="panel pad stack"><b>This screen couldn't be shown.</b><p class="muted small" style="margin:0">Your data is still on this device. Go back to your volumes; if this keeps happening, erase the damaged volume in Settings.</p><button class="btn primary" data-act="home">Back to volumes</button></div>`;
    ui.view = "hub";
  }
  const top = ui.view === "settings" ? "settings" : "hub";
  $("#nav").innerHTML = `<button data-act="home" ${top === "hub" ? 'aria-current="page"' : ""}>${I.hub}Volumes</button><button data-act="settings" ${top === "settings" ? 'aria-current="page"' : ""}>${I.gear}Settings</button>`;
  if (ui.view === "expense" && $("#expForm")) bindExpenseForm();
}
let toastTimer;
function toast(t) {
  document.querySelectorAll(".toast").forEach(n => n.remove());
  const n = document.createElement("div"); n.className = "toast" + (sheetOpen() ? " top" : ""); n.setAttribute("aria-hidden", "true"); n.textContent = t;
  document.body.appendChild(n); clearTimeout(toastTimer); toastTimer = setTimeout(() => n.remove(), Math.max(2400, t.length * 50)); // long warnings stay long enough to read

}
function bindExpenseForm() {
  const f = ui.form, form = $("#expForm");
  form.addEventListener("input", ev => {
    const t = ev.target;
    if (t.id === "f-amount") f.amount = t.value;
    else if (t.id === "f-desc") { f.desc = t.value; if (t.value.trim()) { t.removeAttribute("aria-invalid"); $("#descMsg").textContent = ""; } }

    else if (t.id === "f-date") f.date = t.value;
    else if (t.dataset.in) f.inputs[t.dataset.in] = t.value;
    refreshSplitPreview(); saveDraft();
  });
  form.addEventListener("change", ev => {
    const t = ev.target;
    if (t.id === "f-paid") f.paidBy = t.value;
    if (t.id === "f-date") f.date = t.value;
    if (t.dataset.inc) {
      const id = t.dataset.inc, i = form.querySelector(`[data-in="${CSS.escape(id)}"]`);
      f.include[id] = t.checked;
      if (t.checked && f.splitType === "shares" && !f.inputs[id]) { f.inputs[id] = "1"; if (i) i.value = "1"; }
      if (i) i.disabled = !t.checked;
    }
    refreshSplitPreview(); saveDraft();
  });
  form.addEventListener("click", ev => {
    const c = ev.target.closest("[data-cat]"), s = ev.target.closest("[data-split]");
    if (c) { f.category = c.dataset.cat; form.querySelectorAll("[data-cat]").forEach(b => b.setAttribute("aria-pressed", b === c)); saveDraft(); }
    if (s && f.splitType !== s.dataset.split) {
      f.splitType = s.dataset.split; f.inputs = {};
      const v = vol(), ids = v.members.filter(m => f.include[m.id]).map(m => m.id), amt = parseMoney(f.amount);
      if (f.splitType === "shares") ids.forEach(id => f.inputs[id] = "1");
      if (f.splitType === "percent" && ids.length) { const eq = splitEqual(10000, ids); ids.forEach(id => f.inputs[id] = (eq[id] / 100).toFixed(2)); }
      if (f.splitType === "exact" && amt > 0 && ids.length) { const eq = splitEqual(amt, ids); ids.forEach(id => f.inputs[id] = (eq[id] / 100).toFixed(2)); }
      form.querySelectorAll("[data-split]").forEach(b => b.setAttribute("aria-pressed", b === s));
      $("#splitRows").innerHTML = v.members.map(m => splitRow(v, m)).join("");
      refreshSplitPreview(); saveDraft();
    }
  });
  form.addEventListener("submit", ev => { ev.preventDefault(); submitExpense(); });
  refreshSplitPreview();
}
function selectPalette(id) {
  S.settings.palette = id; commit(); applyTheme(); render();
  const b = $(`[data-pal="${CSS.escape(id)}"]`); if (b) b.focus();
}

// iOS Safari applies :active to a tap only when a touch listener exists; without it the clay press never shows.
document.addEventListener("touchstart", () => {}, { passive: true });
document.addEventListener("click", async ev => {
  if (ev.target.classList && ev.target.classList.contains("scrim")) return closeSheet();
  const el = ev.target.closest("[data-act],[data-pal],[data-set]"); if (!el) return;
  if (el.dataset.pal) return selectPalette(el.dataset.pal);
  if (el.dataset.set) {
    S.settings[el.dataset.set] = el.dataset.val; commit(); applyTheme(); render();
    const b = $(`[data-set="${el.dataset.set}"][data-val="${el.dataset.val}"]`); if (b) b.focus();
    return;
  }
  const a = el.dataset.act, v = vol();
  switch (a) {
    case "home": if (ui.view !== "hub" || sheetOpen()) go("hub"); break;
    case "settings": if (ui.view !== "settings" || sheetOpen()) go("settings"); break;
    case "back": leave(); break;
    case "open": ui.volId = el.dataset.id; go("volume"); break;
    case "closeSheet": closeSheet(); break;
    case "newVolume": volumeSheet(null); break;
    case "editVolume": volumeSheet(v); break;
    case "volMenu": volMenuSheet(); break;
    case "share": shareSheet(); break;
    case "import": importSheet(); break;
    case "restore": importSheet({ restore: true }); break;
    case "dismissRecovered": recovered = false; render(); break;
    case "dismissIosHint": try { localStorage.setItem(IOS_HINT, "1"); } catch (e) {} el.closest("#iosHint").remove(); break;
    case "more": ui.histLimit += 100; render(); break;
    case "sendCode": {
      if (typeof navigator.share !== "function") { await copyShareCode(); break; }
      try { await navigator.share({ title: `HATI² · ${v.title}`, text: $("#s-code").value }); }
      catch (e) { if (!(e && e.name === "AbortError")) await copyShareCode(); }
      break;
    }
    case "copyCode": await copyShareCode(); break;
    case "deleteVolume": confirmSheet("Delete volume?", `${v.title} and all its expenses and payments will be removed from this device.`, "Delete", () => { S.volumes = S.volumes.filter(x => x.id !== v.id); if (!commit()) return; go("hub", { replace: true }); toast("Volume deleted"); }); break;
    case "addMember": if (sheetOpen()) dropSheet(); memberSheet(); break;
    case "addExpense": openExpense(null); break;
    case "editExpense": openExpense(v.expenses.find(e => e.id === el.dataset.id)); break;
    case "deleteExpense": confirmSheet("Delete expense?", `${ui.form.desc || "This expense"} will be removed and balances recalculated.`, "Delete", () => { v.expenses = v.expenses.filter(e => e.id !== ui.form.id); tombstone(v, ui.form.id); if (!commit()) return; leave(); toast("Expense deleted"); }); break;
    case "settle": settleSheet(null); break;
    case "editSettle": settleSheet(v.settlements.find(s => s.id === el.dataset.id)); break;
    case "deleteSettle": { const id = el.dataset.id; confirmSheet("Delete payment?", "This payment will be removed and balances recalculated.", "Delete", () => { v.settlements = v.settlements.filter(s => s.id !== id); tombstone(v, id); if (!commit()) return; closeSheet(); render(); toast("Payment deleted"); }); break; }
    case "editMember": { const m = v.members.find(x => x.id === el.dataset.id); if (m) editMemberSheet(m); break; }
    case "removeMember": removeMember(el.dataset.id); break;
    case "backup": await downloadBackup(); break;
    case "history": go("history"); break;
    case "seed": S.volumes.unshift(exampleVolume()); if (!commit()) break; render(); toast("Example volume added"); break;
    case "reset": confirmSheet("Erase all data?", "Every volume on this device will be deleted. Copies shared to other phones are not affected.", "Erase", () => { S.volumes = []; if (!commit()) return; go("hub", { replace: true }); toast("All data erased"); }); break;
  }

document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && sheetOpen()) { closeSheet(); return; }
  const p = ev.target.closest && ev.target.closest("[data-pal]");
  if (p && ["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(ev.key)) {

addEventListener("storage", ev => {

</script>
