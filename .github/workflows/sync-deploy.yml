name: Sync server

on:
  pull_request:
    paths: ["sync/**", ".github/workflows/sync-deploy.yml"]
  push:
    branches: ["main"]
    paths: ["sync/**", ".github/workflows/sync-deploy.yml"]
  # Run once by hand after the Cloudflare secrets are added.
  workflow_dispatch:

# Only reads the repo; deploy access comes from the Cloudflare secrets.
permissions:
  contents: read

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: sync

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (same pins as the owner's CV deploy).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sync/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Sync deploy skipped::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set in this repo's Actions secrets, so the sync Worker was not deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sync/package-lock.json
      - if: steps.secrets.outputs.ok == 'true'
        run: npm ci
      - name: Deploy to Cloudflare Workers
        if: steps.secrets.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@9681c2997648301493e78cacbfb790a9f19c833f # v3.9.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sync
          wranglerVersion: "4.151.3"
          command: deploy
