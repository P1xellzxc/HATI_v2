name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  unit-tests:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/

  instrumented-tests:
    name: Instrumented Tests (API 34)
    runs-on: ubuntu-latest
    # Separate job so unit tests don't block on emulator spin-up

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew connectedAndroidTest

      - name: Upload instrumented test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-results
          path: |
            app/build/reports/androidTests/
            webapk/build/reports/androidTests/

  build:
    name: Build Debug + Release APK
    runs-on: ubuntu-latest
    needs: [ unit-tests ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build web app APK (debug)
        run: ./gradlew :webapk:assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/

      - name: Upload web app APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: hati-web-apk
          path: webapk/build/outputs/apk/debug/
          if-no-files-found: error

  publish-apk:
    name: Publish HATI² APK (latest)
    runs-on: ubuntu-latest
    needs: [ build, instrumented-tests ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download web APK
        uses: actions/download-artifact@v4
        with:
          name: hati-web-apk
          path: apk

      - name: Publish as the "latest" pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          f=$(ls apk/*.apk | head -1)
          cp "$f" HATI2.apk
          notes="Debug-signed APK of the HATI² web app, built from ${GITHUB_SHA::7}. On your Android phone: open this page, download HATI2.apk, and allow installs from your browser when asked."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "HATI² (latest build)" --notes "$notes" --prerelease
            gh release upload latest HATI2.apk --clobber
          else
            gh release create latest HATI2.apk --title "HATI² (latest build)" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
