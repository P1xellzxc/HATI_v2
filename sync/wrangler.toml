# HATI² live sync: one Durable Object per volume room, end-to-end encrypted
# blobs only. Protocol: sync/README.md. Deployed by .github/workflows/sync-deploy.yml.
name = "hati-sync"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are the ones the Workers free plan allows.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Writes per client IP across all rooms: 60 a minute. namespace_id is any
# account-unique integer string; it only has to stay the same between deploys.
[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "4207"
simple = { limit = 60, period = 60 }

[observability]
enabled = false
