<style>
/* Layout: one phone-width column; sticky top bar, scrolling glass cards over a palette-tinted blob field, fixed bottom nav. */
:root {
  /* Palette inputs, overwritten from the chosen Sanzo Wada theme */
  --ink-l: #000000; --paper-l: #FFFFFF; --acc-l: #FEF08A; --acc-d: #FFF3B0;
  --hero-l: #FFF5D6; --hero-d: #3A3422; --food-l: #FFC9A8; --muted-l: #6B7280;
  --b1: #FEF08A; --b2: #BFDBFE; --b3: #BBF7D0; --b4: #E9D5FF;

  /* Light tokens */
  --bg: color-mix(in srgb, var(--paper-l) 88%, var(--b2) 12%);
  --fg: var(--ink-l);
  --sub: var(--muted-l);
  --glass: rgba(255, 255, 255, 0.58);
  --glass-strong: rgba(255, 255, 255, 0.78);
  --line: color-mix(in srgb, var(--ink-l) 16%, transparent);
  --accent: var(--acc-l);
  --on-accent: var(--ink-l);
  --hero: var(--hero-l);
  --chip: var(--food-l);
  --pos: #166534; --pos-bg: rgba(187, 247, 208, 0.7);
  --neg: #9D174D; --neg-bg: rgba(251, 207, 232, 0.7);
  --err: #B3261E;
  --blob-a: 0.55;
  --shadow: 0 10px 30px color-mix(in srgb, var(--ink-l) 10%, transparent);
  --nav: rgba(255, 255, 255, 0.86);
  --label: color-mix(in srgb, var(--fg) 80%, transparent);
  --card: rgba(255, 255, 255, 0.74);

  --font-disp: 'Black Han Sans', 'Arial Black', Impact, sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-pill: 999px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: color-mix(in srgb, var(--ink-l) 30%, #07070F);
    --fg: #ECEDFF; --sub: rgba(205, 210, 240, 0.7);
    --glass: rgba(255, 255, 255, 0.06); --glass-strong: rgba(255, 255, 255, 0.11);
    --line: rgba(255, 255, 255, 0.14);
    --accent: var(--acc-d); --on-accent: #121212;
    --hero: var(--hero-d); --chip: color-mix(in srgb, var(--food-l) 30%, #121212);
    --pos: #BBF7D0; --pos-bg: rgba(187, 247, 208, 0.13);
    --neg: #FBCFE8; --neg-bg: rgba(251, 207, 232, 0.13);
    --err: #F2B8B5; --blob-a: 0.32;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    --nav: rgba(10, 9, 24, 0.86); --card: rgba(22, 22, 38, 0.72);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: color-mix(in srgb, var(--ink-l) 30%, #07070F);
  --fg: #ECEDFF; --sub: rgba(205, 210, 240, 0.7);
  --glass: rgba(255, 255, 255, 0.06); --glass-strong: rgba(255, 255, 255, 0.11);
  --line: rgba(255, 255, 255, 0.14);
  --accent: var(--acc-d); --on-accent: #121212;
  --hero: var(--hero-d); --chip: color-mix(in srgb, var(--food-l) 30%, #121212);
  --pos: #BBF7D0; --pos-bg: rgba(187, 247, 208, 0.13);
  --neg: #FBCFE8; --neg-bg: rgba(251, 207, 232, 0.13);
  --err: #F2B8B5; --blob-a: 0.32;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --nav: rgba(10, 9, 24, 0.86); --card: rgba(22, 22, 38, 0.72);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }

}

:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; box-shadow: 0 0 0 6px var(--accent); }

/* Blob field */
.blobs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.blobs { contain: strict; }
.blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: var(--blob-a); }

.blob:nth-child(3) { width: 46vmax; height: 46vmax; left: -10vmax; bottom: -20vmax; background: var(--b3); animation-delay: -15s; }
.blob:nth-child(4) { width: 34vmax; height: 34vmax; right: -6vmax; bottom: 8vh; background: var(--b4); animation-delay: -4s; }

/* Shell */
#app {
  position: relative; z-index: 1;
  max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

  min-height: 100%;
}
.topbar {

  padding: 12px max(16px, env(safe-area-inset-left, 0px));

}
.topbar h1 { flex: 1; min-width: 0; margin: 0; font: 400 1.3rem/1.1 var(--font-disp); letter-spacing: .04em; text-transform: uppercase; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.topbar h1:focus { outline: none; }
.topbar .sub { font-size: .8rem; max-width: 40%; }
@media (max-width: 360px) { .topbar .sub { display: none; } }
.tagline { margin: 6px 2px 0; font-size: .9rem; color: var(--label); }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 400 .9rem var(--font-disp); flex-shrink: 0; border: 2px solid var(--fg); }
.ico { width: 44px; height: 44px; border-radius: var(--r-sm); background: var(--glass); border: 1px solid var(--line); display: grid; place-items: center; flex-shrink: 0; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.ico svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.glass {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow);
}
.pad { padding: 16px; }
.label { font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--label); margin: 14px 2px 6px; }
h2.label { font-family: var(--font-body); }
.muted { color: var(--sub); }
.small { font-size: .8rem; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

/* Buttons */
.btn {
  min-height: 44px;
  border: 2px solid var(--fg); border-radius: var(--r-md);
  background: var(--glass-strong); padding: 11px 14px;
  font-weight: 700; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 3px 3px 0 var(--fg); transition: transform .1s, box-shadow .1s;
}
.btn:active { transform: translate(3px,3px); box-shadow: 0 0 0 var(--fg); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.quiet { border-width: 1px; border-color: var(--line); box-shadow: none; }

.btn.block { width: 100%; }

.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Hub */
.vol { overflow: hidden; text-align: left; padding: 0; width: 100%; display: block; }
.vol-cover { height: 92px; position: relative; display: grid; place-items: center; font-size: 2.6rem; background: radial-gradient(ellipse at center, color-mix(in srgb, var(--accent) 45%, transparent), transparent 72%); border-bottom: 1px solid var(--line); }
.pill { font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: var(--r-pill); border: 1px solid var(--line); white-space: nowrap; }
.pill.pos { background: var(--pos-bg); color: var(--pos); }
.pill.neg { background: var(--neg-bg); color: var(--neg); }
.pill.even { background: var(--glass-strong); color: var(--sub); }
.vol-cover .pill { position: absolute; right: 10px; bottom: 9px; }
.vol-info { padding: 12px 14px; }

/* Volume */
.hero { text-align: center; padding: 20px 16px; background: color-mix(in srgb, var(--hero) 80%, transparent); }
.hero .emoji { font-size: 2.6rem; }
.hero .k { font-size: .68rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; margin-top: 4px; }
.hero .amt { font: 400 2.3rem/1.15 var(--font-disp); letter-spacing: .02em; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 10px; text-align: center; border-radius: var(--r-md); }
.stat b { display: block; font: 400 1.05rem var(--font-disp); }
.stat span { font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--sub); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 5px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--glass); font-size: .8rem; font-weight: 600; }
.chip.add { padding: 5px 14px; min-height: 44px; border-style: dashed; background: transparent; }
.av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700; color: var(--on-accent); border: 1.5px solid var(--fg); flex-shrink: 0; }
.tx { display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-radius: var(--r-md); width: 100%; text-align: left; }
.tx-ic { width: 38px; height: 38px; border-radius: var(--r-sm); display: grid; place-items: center; font-size: 1.1rem; background: var(--glass-strong); border: 1px solid var(--line); flex-shrink: 0; }
.tx-a { font-weight: 700; white-space: nowrap; }
.debt { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--r-md); width: 100%; text-align: left; min-height: 48px; }
.logo svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; }
.topbar h1:focus-visible { outline: none; box-shadow: none; }
.vol-cover .pill { max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis; }
.bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-right: 2px solid var(--fg); }
.empty { text-align: center; padding: 22px 16px; }
.empty .kao { font: 400 1.4rem var(--font-disp); }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .legend { font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--label); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
legend { padding: 0; margin-bottom: 6px; }
.input, select.input, textarea.input {
  width: 100%; padding: 12px 14px; border-radius: var(--r-md); font-size: 16px;
  border: 1.5px solid var(--line); background: var(--glass-strong);
  outline: none; -webkit-appearance: none; appearance: none;
}
.input:focus { border-color: var(--fg); }
.input[aria-invalid="true"] { border-color: var(--err); }
select.input { background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.amount-box { text-align: center; padding: 16px; background: color-mix(in srgb, var(--hero) 80%, transparent); }
.amount-box .row { justify-content: center; }
.amount-box .cur { font: 400 1.4rem var(--font-disp); opacity: .6; }
.amount-box input { width: 100%; max-width: 260px; text-align: center; font: 400 2.4rem var(--font-disp); background: transparent; border: none; outline: none; letter-spacing: .02em; }
.seg { display: flex; flex-wrap: wrap; padding: 4px; gap: 4px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--glass); }
.seg button { flex: 1 1 auto; min-height: 44px; border: none; background: none; border-radius: var(--r-pill); padding: 8px 10px; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: inset 0 0 0 2px var(--fg); }
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cat { border: 1.5px solid var(--line); border-radius: var(--r-md); background: var(--glass); padding: 10px 6px; font-size: .78rem; font-weight: 600; display: grid; justify-items: center; gap: 2px; }
.cat span { font-size: 1.2rem; }
.cat[aria-pressed="true"] { background: var(--chip); border-color: var(--fg); box-shadow: 2px 2px 0 var(--fg); }
.split-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-md); min-height: 52px; }
.split-row.typed { grid-template-columns: auto minmax(0, 1fr); }
.split-row.typed > .row:last-child { grid-column: 2; justify-content: flex-end; }

.split-row .share { text-align: right; font-weight: 700; white-space: nowrap; }
.split-row .input { width: 110px; padding: 8px 10px; text-align: right; }

.msg { font-size: .82rem; font-weight: 600; color: var(--err); min-height: 1.2em; }
.msg.ok { color: var(--pos); }

/* Bottom nav */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  display: flex; justify-content: center; gap: 8px;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--nav); border-top: 1px solid var(--line);
  backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%);
}
.nav button { flex: 1; max-width: 160px; min-height: 52px; border: none; background: none; display: grid; justify-items: center; gap: 2px; padding: 6px; border-radius: var(--r-md); font-size: .75rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--sub); }
.nav button[aria-current="page"] { color: var(--on-accent); background: var(--accent); box-shadow: inset 0 0 0 2px var(--fg); }
.nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* Sheet (modal) */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.38); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 520px; max-height: min(88%, var(--vvh, 100dvh)); overflow: auto; overscroll-behavior: contain;
  border-radius: 24px 24px 0 0; border: 1px solid var(--line); border-bottom: none;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(30px) saturate(170%); -webkit-backdrop-filter: blur(30px) saturate(170%);
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet h2 { margin: 0 0 12px; font: 400 1.3rem var(--font-disp); letter-spacing: .04em; text-transform: uppercase; }

/* Settings palettes */
.pal { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: var(--r-md); text-align: left; border: 2px solid; }
.pal[aria-checked="true"] { border-width: 3px; }
.sw { display: flex; width: 72px; height: 28px; border: 1px solid currentColor; flex-shrink: 0; }
.sw i { flex: 1; }
.pal .dot { width: 28px; height: 28px; border-radius: 8px; border: 2px solid currentColor; display: grid; place-items: center; font-weight: 700; flex-shrink: 0; }
.banner { font-size: .78rem; padding: 10px 12px; border-radius: var(--r-md); margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; padding: 10px 16px; border-radius: var(--r-pill); background: var(--fg); color: var(--bg); font-size: .85rem; font-weight: 700; max-width: min(90vw, 480px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

function parseMoney(s) {
  let t = String(s).trim().replace(/\s/g, "");
  if (/^\d+,\d{1,2}$/.test(t)) t = t.replace(",", ".");
  else if (/^\d{1,3}(,\d{3})+(\.\d{0,2})?$/.test(t)) t = t.replace(/,/g, "");
  if (!/^(\d+(\.\d{0,2})?|\.\d{1,2})$/.test(t)) return NaN;
  return Math.round(parseFloat(t) * 100);
}
function parseWeight(s) {
  const t = String(s).trim().replace(",", ".");
  if (!/^\d{1,7}(\.\d+)?$/.test(t)) return NaN;

  return Number.isFinite(x) && x <= 1e6 ? x : NaN;

function load() {
  let raw;
  try { raw = localStorage.getItem(KEY); } catch (e) { storageOk = false; return null; }
  if (!raw) return null;
  try { return normalize(JSON.parse(raw)); }
  catch (e) {
    recovered = true;
    try { localStorage.setItem("hati2.corrupt." + Date.now(), raw); } catch (_) {}
    return null;
  }
}
function normalize(d) {
  if (!d || typeof d !== "object" || !Array.isArray(d.volumes)) throw new Error("bad shape");
  const st = { ...DEFAULT_SETTINGS, ...(d.settings && typeof d.settings === "object" ? d.settings : {}) };
  const volumes = [];
  for (const v of d.volumes) {
    if (!v || typeof v !== "object") { recovered = true; continue; }
    const fixed = { ...v, expenses: Array.isArray(v.expenses) ? v.expenses : [], settlements: Array.isArray(v.settlements) ? v.settlements : [] };
    fixed.expenses = fixed.expenses.filter(e => e && typeof e === "object").map(e => ({ ...e, date: typeof e.date === "string" ? e.date : today(), splits: e.splits && typeof e.splits === "object" ? e.splits : {} }));
    if (validVolume(fixed)) volumes.push(cleanVolume(fixed)); else recovered = true;
  }
  return { settings: st, volumes };
}

// ── Split math (integer cents, sums always exact) ─────────
function splitEqual(total, ids) {
  const out = {}, n = ids.length, base = Math.floor(total / n);
  let rem = total - base * n;
  ids.forEach(id => { out[id] = base + (rem-- > 0 ? 1 : 0); });
  return out;
}
function splitWeighted(total, weights) {
  const ids = Object.keys(weights), W = ids.reduce((a, id) => a + weights[id], 0), out = {};
  let used = 0;
  const parts = ids.map(id => { const exact = total * weights[id] / W, fl = Math.floor(exact); out[id] = fl; used += fl; return [id, exact - fl]; });
  parts.sort((a, b) => b[1] - a[1]);
  for (let i = 0; used < total; i++, used++) out[parts[i % parts.length][0]]++;
  return out;
}
const splitShares = (total, w) => splitWeighted(total, w);

// ── Debt engine (port of CalculateDebtsUseCase, in cents) ─
function balances(v) {
  const b = Object.fromEntries(v.members.map(m => [m.id, 0]));
  for (const e of v.expenses) {
    b[e.paidBy] = (b[e.paidBy] || 0) + e.amount;
    for (const [pid, amt] of Object.entries(e.splits)) b[pid] = (b[pid] || 0) - amt;
  }
  for (const s of v.settlements) { b[s.from] = (b[s.from] || 0) + s.amount; b[s.to] = (b[s.to] || 0) - s.amount; }
  return b;
}
function simplify(b) {
  const givers = [], receivers = [], out = [];
  for (const [id, c] of Object.entries(b)) { if (c < -1) givers.push({ id, a: -c }); else if (c > 1) receivers.push({ id, a: c }); }
  givers.sort((x, y) => y.a - x.a); receivers.sort((x, y) => y.a - x.a);
  let i = 0, j = 0;
  while (i < givers.length && j < receivers.length) {
    const t = Math.min(givers[i].a, receivers[j].a);
    if (t > 1) out.push({ from: givers[i].id, to: receivers[j].id, amount: t });
    givers[i].a -= t; receivers[j].a -= t;
    if (givers[i].a < 1) i++;
    if (receivers[j].a < 1) j++;
  }
  return out;
}
function pairwise(v) {
  const m = {};
  const add = (f, t, a) => { (m[f] = m[f] || {})[t] = (m[f][t] || 0) + a; };
  for (const e of v.expenses) for (const [pid, a] of Object.entries(e.splits)) if (pid !== e.paidBy && a > 0) add(pid, e.paidBy, a);
  for (const s of v.settlements) if (m[s.from]) m[s.from][s.to] = (m[s.from][s.to] || 0) - s.amount;
  const out = [], seen = new Set();
  for (const [d, targets] of Object.entries(m)) for (const [c, a] of Object.entries(targets)) {
    const key = [d, c].sort().join(":"); if (seen.has(key)) continue; seen.add(key);
    const net = a - ((m[c] && m[c][d]) || 0);
    if (net > 1) out.push({ from: d, to: c, amount: net }); else if (net < -1) out.push({ from: c, to: d, amount: -net });
  }
  return out;
}
const debts = v => S.settings.strategy === "pairwise" ? pairwise(v) : simplify(balances(v));

function niceDate(d) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
  if (d === today()) return "Today";
  if (d === isoLocal(new Date(Date.now() - 864e5))) return "Yesterday";
  const [Y, M, D] = d.split("-").map(Number);
  return new Date(Y, M - 1, D).toLocaleDateString("en-US", { month: "short", day: "numeric", ...(Y !== new Date().getFullYear() ? { year: "numeric" } : {}) });
}

const hostTheme = document.documentElement.getAttribute("data-theme");
function applyTheme() {
  const p = PALETTES.find(x => x.id === S.settings.palette) || PALETTES[0];

  r.setProperty("--ink-l", p.ink); r.setProperty("--paper-l", p.paper);
  r.setProperty("--acc-l", p.acc); r.setProperty("--acc-d", p.accD);
  r.setProperty("--hero-l", p.hero); r.setProperty("--hero-d", p.heroD);
  r.setProperty("--food-l", p.food); r.setProperty("--muted-l", p.muted);
  const sw = p.sw.length >= 4 ? p.sw : [...p.sw, p.tert];
  ["--b1", "--b2", "--b3", "--b4"].forEach((k, i) => r.setProperty(k, sw[i % sw.length]));
  const m = S.settings.mode, root = document.documentElement;
  if (m === "system") { hostTheme ? root.setAttribute("data-theme", hostTheme) : root.removeAttribute("data-theme"); }
  else root.setAttribute("data-theme", m);

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", dark ? "#0B0A18" : p.paper);
}

}

function computeSplits() {
  const f = ui.form, v = vol(), amount = parseMoney(f.amount);
  const ids = v.members.filter(m => f.include[m.id]).map(m => m.id);
  if (isNaN(amount)) return { error: "Use numbers like 12.50 (up to 2 decimals)." };
  if (!(amount > 0)) return { error: "Enter an amount greater than zero." };
  if (amount > MAX_CENTS) return { error: "That amount is too large." };
  if (!ids.length) return { error: "Pick at least one person to split with." };
  if (f.splitType === "equal") return { splits: splitEqual(amount, ids), amount };
  if (f.splitType === "exact") {
    const out = {}; let sum = 0;
    for (const id of ids) { const c = parseMoney(f.inputs[id] || "0"); if (isNaN(c)) return { error: `Check the amount for ${meName(v, id)}.` }; out[id] = c; sum += c; }
    if (sum !== amount) return { error: sum < amount ? `Exact amounts add up to ${fmt(sum, v.currency)}; ${fmt(amount - sum, v.currency)} left to assign.` : `Exact amounts add up to ${fmt(sum, v.currency)}; that's ${fmt(sum - amount, v.currency)} over.`, partial: out, amount };
    return { splits: out, amount };
  }
  const w = {};
  for (const id of ids) { const x = parseWeight(f.inputs[id] || ""); if (isNaN(x)) return { error: `Check the ${f.splitType === "percent" ? "percent" : "shares"} for ${meName(v, id)}.` }; w[id] = x; }
  const W = Object.values(w).reduce((a, b) => a + b, 0);
  if (f.splitType === "percent" && Math.round(W * 100) !== 10000) return { error: `Percentages add up to ${W.toFixed(2)}%; they need to total 100%.` };
  if (W <= 0) return { error: "Give at least one person a share." };
  return { splits: splitWeighted(amount, w), amount };
}
function refreshSplitPreview() {
  const v = vol(), r = computeSplits();
  document.querySelectorAll("[data-share]").forEach(el => {
    const id = el.dataset.share, val = r.splits ? r.splits[id] : r.partial ? r.partial[id] : undefined;
    el.textContent = ui.form.include[id] && val !== undefined ? fmt(val, v.currency) : "";
  });
  $("#splitSum").textContent = r.splits ? `Split ${Object.keys(r.splits).length} ways · totals ${fmt(r.amount, v.currency)}` : "";
  $("#formMsg").textContent = ui.form.touched ? (r.error || "") : "";
}
const DRAFT = "hati2.draft";

function formFrom(e) {

    include: Object.fromEntries(v.members.map(m => [m.id, m.id in e.splits])), inputs: { ...(e.inputs || {}) } }
    : { amount: "", desc: "", paidBy: v.meId, date: today(), category: "food", splitType: "equal", note: "", include: Object.fromEntries(v.members.map(m => [m.id, true])), inputs: {} };

  const str = (v, max) => typeof v === "string" && v.trim().length > 0 && v.length <= max;
  const int = n => Number.isInteger(n) && n >= 0 && n <= MAX_CENTS;
  const date = d => typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d);
  if (!x || typeof x !== "object" || !ID_RE.test(x.id) || !str(x.title, 40)) return false;
  if (!Array.isArray(x.members) || !Array.isArray(x.expenses) || !Array.isArray(x.settlements)) return false;
  if (!x.members.length || x.members.length > 200 || x.expenses.length > 20000 || x.settlements.length > 20000) return false;
  if (!x.members.every(m => m && ID_RE.test(m.id) && str(m.name, 40))) return false;
  const ids = new Set(x.members.map(m => m.id));
  if (ids.size !== x.members.length) return false;
  const uniq = list => new Set(list.map(i => i.id)).size === list.length;
  return uniq(x.expenses) && uniq(x.settlements) &&
    x.expenses.every(e => e && ID_RE.test(e.id) && str(e.desc, 100) && int(e.amount) && e.amount > 0 && ids.has(e.paidBy) && date(e.date) &&
      (e.note === undefined || (typeof e.note === "string" && e.note.length <= 200)) &&
      e.splits && typeof e.splits === "object" && Object.keys(e.splits).length > 0 &&
      Object.entries(e.splits).every(([k, a]) => ids.has(k) && int(a)) && Object.values(e.splits).reduce((a, b) => a + b, 0) === e.amount) &&
    x.settlements.every(t => t && ID_RE.test(t.id) && ids.has(t.from) && ids.has(t.to) && t.from !== t.to && int(t.amount) && t.amount > 0 && date(t.date));
}
function cleanVolume(x) {
  return {
    id: x.id, title: x.title.trim(), type: typeOf(x.type)[0], currency: CURRENCIES.includes(x.currency) ? x.currency : "$",
    meId: ID_RE.test(x.meId) && x.members.some(m => m.id === x.meId) ? x.meId : x.members[0].id, created: Number(x.created) || Date.now(),
    members: x.members.map(m => ({ id: m.id, name: m.name.trim() })),
    expenses: x.expenses.map(e => ({ id: e.id, desc: e.desc.trim(), amount: e.amount, paidBy: e.paidBy, category: catOf(e.category)[0], date: e.date,
      splitType: ["equal", "exact", "percent", "shares"].includes(e.splitType) ? e.splitType : "exact",
      splits: { ...e.splits }, inputs: Object.fromEntries(Object.entries(e.inputs && typeof e.inputs === "object" ? e.inputs : {}).filter(([k, v]) => x.members.some(m => m.id === k) && typeof v === "string" && v.length <= 12)),
      note: typeof e.note === "string" ? e.note : "" })),
    settlements: x.settlements.map(t => ({ id: t.id, from: t.from, to: t.to, amount: t.amount, date: t.date }))
  };
}
function importSheet() {
  sheet(`<h2>Import volume</h2><div class="stack">
    <div class="field"><label for="s-paste">Paste a share code</label><textarea id="s-paste" class="input" rows="4" placeholder='{"app":"hati2-mock",…}'></textarea></div>
    <div class="field"><label for="s-file">Or choose a .json file</label><input id="s-file" type="file" accept=".json,application/json,text/plain" class="input"></div>
    <div id="s-pick"></div>
    <div class="msg" id="sheetMsg" role="alert"></div>
    <div class="btns"><button type="button" class="btn quiet" data-act="closeSheet">Cancel</button><button class="btn primary" id="s-go">Check code</button></div></div>`,
    () => {
      let data;
      try { data = JSON.parse($("#s-paste").value.trim()); } catch (e) { return sheetMsg("That code isn't valid. Copy the whole code and try again."); }
      const x = data && data.app === "hati2-mock" ? data.volume : null;
      if (!validVolume(x)) return sheetMsg("This code doesn't contain a HATI² volume, or its totals don't add up.");
      const pick = $("#s-pick");
      if (!pick.innerHTML) {
        const exists = S.volumes.some(v => v.id === x.id);
        pick.innerHTML = `<div class="field"><label for="s-who">Which member are you?</label><select id="s-who" class="input">${x.members.map(m => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("")}</select></div>` +
          (exists ? `<div class="field"><label for="s-mode">You already have this volume</label><select id="s-mode" class="input"><option value="replace">Replace my copy with this one</option><option value="copy">Keep both</option></select></div>` : "");
        const go = $("#s-go"); go.textContent = "Import"; go.disabled = true; setTimeout(() => { go.disabled = false; }, 500);
        sheetMsg(""); return;
      }
      const nv = cleanVolume(x), who = $("#s-who").value;
      if (!nv.members.some(m => m.id === who)) return sheetMsg("Choose which member you are.");
      nv.meId = who;
      const mode = $("#s-mode") ? $("#s-mode").value : "new";
      if (mode === "replace") S.volumes = S.volumes.map(v => v.id === nv.id ? nv : v);
      else { if (mode === "copy") nv.id = uid(); S.volumes.unshift(nv); }
      save(); closeSheet(); ui.volId = nv.id; go("volume"); toast("Volume imported");
    });
  $("#s-paste").addEventListener("input", () => { $("#s-pick").innerHTML = ""; $("#s-go").textContent = "Check code"; sheetMsg(""); });
  $("#s-file").addEventListener("change", ev => {
    const file = ev.target.files[0]; if (!file) return;
    const rd = new FileReader(); rd.onload = () => { $("#s-paste").value = String(rd.result); $("#s-paste").dispatchEvent(new Event("input")); }; rd.readAsText(file);
  });
}


// ── Navigation ────────────────────────────────────────────
function hashFor() {
  switch (ui.view) {
    case "settings": return "#prefs";
    case "volume": return "#v-" + ui.volId;
    case "history": return "#v-" + ui.volId + "-history";
    case "expense": return "#v-" + ui.volId + (ui.form && ui.form.id ? "-edit-" + ui.form.id : "-new");
    default: return "";
  }
}
function parseHash() {
  const h = location.hash.slice(1);
  if (h === "prefs") return { view: "settings" };
  const m = /^v-([A-Za-z0-9]+)(?:-(history|new|edit-([A-Za-z0-9]+)))?$/.exec(h);
  if (!m || !S.volumes.some(v => v.id === m[1])) return { view: "hub" };
  if (!m[2]) return { view: "volume", volId: m[1] };
  if (m[2] === "history") return { view: "history", volId: m[1] };
  return { view: "expense", volId: m[1], expId: m[3] || null };
}
const depth = () => (history.state && history.state.depth) || 0;
function setUrl(replace) {
  const h = hashFor(), url = h || location.pathname + location.search;
  if (!replace && (location.hash || "") === h) return;
  try { history[replace ? "replaceState" : "pushState"]({ depth: replace ? depth() : depth() + 1 }, "", url); } catch (e) {}
}
function applyRoute() {
  const r = parseHash();
  ui.view = r.view; ui.volId = r.volId || null;
  if (r.view === "expense") {
    const v = vol(), e = r.expId ? v.expenses.find(x => x.id === r.expId) : null;
    if (r.expId && !e) ui.view = "volume";
    else ui.form = draftFor(r.expId || null) || formFrom(e);
  }
}
function parentOf() {
  if (ui.view === "expense") return ui.from || "volume";
  if (ui.view === "history") return "volume";
  return "hub";
}
function go(view, { replace = false } = {}) {
  const had = sheetOpen();
  if (had) dropSheet();
  if (view !== "expense" && ui.view === "expense") clearDraft();
  ui.view = view; ui.histLimit = 100;
  setUrl(replace || had);
  render(); window.scrollTo(0, 0); focusTitle();
}
function leave() {
  if (ui.view === "expense") clearDraft();
  if (depth() > 0) history.back();
  else go(parentOf(), { replace: true });
}
function focusTitle() { const h = $("#app h1"); if (h) h.focus({ preventScroll: true }); }
addEventListener("popstate", () => {
  if (sheetOpen()) { dropSheet(); setUrl(false); return; }
  applyRoute(); render(); window.scrollTo(0, 0); focusTitle();
});

function render() {
  try { $("#app").innerHTML = views[ui.view]() + banner(); }
  catch (e) {
    $("#app").innerHTML = topbar("HATI²") + `<div class="glass pad stack"><b>This screen couldn't be shown.</b><p class="muted small" style="margin:0">Your data is still on this device. Go back to your volumes; if this keeps happening, erase the damaged volume in Settings.</p><button class="btn primary" data-act="home">Back to volumes</button></div>`;
    ui.view = "hub";
  }
  const top = ui.view === "settings" ? "settings" : "hub";
  $("#nav").innerHTML = `<button data-act="home" ${top === "hub" ? 'aria-current="page"' : ""}>${I.hub}Volumes</button><button data-act="settings" ${top === "settings" ? 'aria-current="page"' : ""}>${I.gear}Settings</button>`;
  if (ui.view === "expense" && $("#expForm")) bindExpenseForm();
}
let toastTimer;
function toast(t) {
  document.querySelectorAll(".toast").forEach(n => n.remove());
  const n = document.createElement("div"); n.className = "toast" + (sheetOpen() ? " top" : ""); n.setAttribute("aria-hidden", "true"); n.textContent = t;
  document.body.appendChild(n); clearTimeout(toastTimer); toastTimer = setTimeout(() => n.remove(), 2400);
  const live = $("#status"); live.textContent = ""; setTimeout(() => { live.textContent = t; }, 30);
}
function bindExpenseForm() {
  const f = ui.form, form = $("#expForm");
  form.addEventListener("input", ev => {
    const t = ev.target;
    if (t.id === "f-amount") f.amount = t.value;
    else if (t.id === "f-desc") { f.desc = t.value; if (t.value.trim()) { t.removeAttribute("aria-invalid"); $("#descMsg").textContent = ""; } }
    else if (t.id === "f-note") f.note = t.value;
    else if (t.id === "f-date") f.date = t.value;
    else if (t.dataset.in) f.inputs[t.dataset.in] = t.value;
    refreshSplitPreview(); saveDraft();
  });
  form.addEventListener("change", ev => {
    const t = ev.target;
    if (t.id === "f-paid") f.paidBy = t.value;
    if (t.id === "f-date") f.date = t.value;
    if (t.dataset.inc) {
      const id = t.dataset.inc, i = form.querySelector(`[data-in="${CSS.escape(id)}"]`);
      f.include[id] = t.checked;
      if (t.checked && f.splitType === "shares" && !f.inputs[id]) { f.inputs[id] = "1"; if (i) i.value = "1"; }
      if (i) i.disabled = !t.checked;
    }
    refreshSplitPreview(); saveDraft();
  });
  form.addEventListener("click", ev => {
    const c = ev.target.closest("[data-cat]"), s = ev.target.closest("[data-split]");
    if (c) { f.category = c.dataset.cat; form.querySelectorAll("[data-cat]").forEach(b => b.setAttribute("aria-pressed", b === c)); saveDraft(); }
    if (s && f.splitType !== s.dataset.split) {
      f.splitType = s.dataset.split; f.inputs = {};
      const v = vol(), ids = v.members.filter(m => f.include[m.id]).map(m => m.id), amt = parseMoney(f.amount);
      if (f.splitType === "shares") ids.forEach(id => f.inputs[id] = "1");
      if (f.splitType === "percent" && ids.length) { const eq = splitEqual(10000, ids); ids.forEach(id => f.inputs[id] = (eq[id] / 100).toFixed(2)); }
      if (f.splitType === "exact" && amt > 0 && ids.length) { const eq = splitEqual(amt, ids); ids.forEach(id => f.inputs[id] = (eq[id] / 100).toFixed(2)); }
      form.querySelectorAll("[data-split]").forEach(b => b.setAttribute("aria-pressed", b === s));
      $("#splitRows").innerHTML = v.members.map(m => splitRow(v, m)).join("");
      refreshSplitPreview(); saveDraft();
    }
  });
  form.addEventListener("submit", ev => { ev.preventDefault(); submitExpense(); });
  refreshSplitPreview();
}
function selectPalette(id) {
  S.settings.palette = id; save(); applyTheme(); render();
  const b = $(`[data-pal="${CSS.escape(id)}"]`); if (b) b.focus();
}

document.addEventListener("click", async ev => {
  if (ev.target.classList && ev.target.classList.contains("scrim")) return closeSheet();
  const el = ev.target.closest("[data-act],[data-pal],[data-set]"); if (!el) return;
  if (el.dataset.pal) return selectPalette(el.dataset.pal);
  if (el.dataset.set) {
    S.settings[el.dataset.set] = el.dataset.val; save(); applyTheme(); render();
    const b = $(`[data-set="${el.dataset.set}"][data-val="${el.dataset.val}"]`); if (b) b.focus();
    return;
  }
  const a = el.dataset.act, v = vol();
  switch (a) {
    case "home": if (ui.view !== "hub" || sheetOpen()) go("hub"); break;
    case "settings": if (ui.view !== "settings" || sheetOpen()) go("settings"); break;
    case "back": leave(); break;
    case "open": ui.volId = el.dataset.id; go("volume"); break;
    case "closeSheet": closeSheet(); break;
    case "newVolume": volumeSheet(null); break;
    case "editVolume": volumeSheet(v); break;
    case "volMenu": volMenuSheet(); break;
    case "share": shareSheet(); break;
    case "import": importSheet(); break;
    case "dismissRecovered": recovered = false; render(); break;
    case "more": ui.histLimit += 100; render(); break;
    case "copyCode": {
      const ta = $("#s-code");
      try { await navigator.clipboard.writeText(ta.value); sheetMsg("Copied. Paste it in a chat."); }
      catch (e) { ta.focus(); ta.select(); sheetMsg("Text selected. Use your phone's Copy."); }
      break;
    }
    case "deleteVolume": confirmSheet("Delete volume?", `${v.title} and all its expenses and payments will be removed from this device.`, "Delete", () => { S.volumes = S.volumes.filter(x => x.id !== v.id); save(); go("hub", { replace: true }); toast("Volume deleted"); }); break;
    case "addMember": if (sheetOpen()) dropSheet(); memberSheet(); break;
    case "addExpense": openExpense(null); break;
    case "editExpense": openExpense(v.expenses.find(e => e.id === el.dataset.id)); break;
    case "deleteExpense": confirmSheet("Delete expense?", `${ui.form.desc || "This expense"} will be removed and balances recalculated.`, "Delete", () => { v.expenses = v.expenses.filter(e => e.id !== ui.form.id); save(); leave(); toast("Expense deleted"); }); break;
    case "settle": settleSheet(null); break;
    case "editSettle": settleSheet(v.settlements.find(s => s.id === el.dataset.id)); break;
    case "deleteSettle": v.settlements = v.settlements.filter(s => s.id !== el.dataset.id); save(); closeSheet(); render(); toast("Payment deleted"); break;
    case "history": go("history"); break;
    case "seed": S.volumes.unshift(exampleVolume()); save(); render(); toast("Example volume added"); break;
    case "reset": confirmSheet("Erase all data?", "Every volume on this device will be deleted. Copies shared to other phones are not affected.", "Erase", () => { S.volumes = []; save(); go("hub", { replace: true }); toast("All data erased"); }); break;
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && sheetOpen()) { closeSheet(); return; }
  const p = ev.target.closest && ev.target.closest("[data-pal]");
  if (p && ["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(ev.key)) {
    ev.preventDefault();
    const i = PALETTES.findIndex(x => x.id === p.dataset.pal), d = ev.key === "ArrowDown" || ev.key === "ArrowRight" ? 1 : -1;
    selectPalette(PALETTES[(i + d + PALETTES.length) % PALETTES.length].id);
  }
});
addEventListener("storage", ev => {
  if (ev.key !== KEY || ev.newValue === null) return;
  const fresh = load(); if (!fresh) return;
  S = fresh; applyTheme();
  if (sheetOpen()) { dropSheet(); toast("Updated from another tab"); }
  if (ui.view === "expense") return;
  if (!vol() && ui.view !== "hub" && ui.view !== "settings") ui.view = "hub";
  render();
});
if (window.matchMedia) { const mq = matchMedia("(prefers-color-scheme: dark)"); mq.addEventListener && mq.addEventListener("change", () => applyTheme()); }
if (window.visualViewport) { const vv = () => document.documentElement.style.setProperty("--vvh", visualViewport.height + "px"); visualViewport.addEventListener("resize", vv); vv(); }

applyTheme();
try { history.replaceState({ depth: depth() }, ""); } catch (e) {}
applyRoute();
if (hashFor() !== (location.hash || "")) setUrl(true);
render();

if ("serviceWorker" in navigator && window.isSecureContext) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
