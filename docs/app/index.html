/* Layout: one phone-width column of ink-bordered panels on flat paper; volumes are numbered spines, lists are ruled ledgers, the balance panel carries screentone. */
:root {
  /* Palette inputs from the chosen Sanzo Wada plate */
  --ink-l: #000000; --paper-l: #FFFFFF; --acc-l: #FEF08A; --acc-d: #FFF3B0;
  --hero-l: #FFF5D6; --food-l: #FFC9A8; --muted-l: #6B7280;
  --b1: #FEF08A; --b2: #BFDBFE; --b3: #BBF7D0; --b4: #E9D5FF;

  /* Light: ink on paper */
  --bg: var(--paper-l);
  --fg: var(--ink-l);
  --sub: var(--muted-l);
  --label: var(--muted-l);
  --panel: var(--paper-l);
  --sunk: color-mix(in srgb, var(--ink-l) 5%, var(--paper-l));
  --line: color-mix(in srgb, var(--ink-l) 22%, var(--paper-l));
  --rule: var(--ink-l);
  --accent: var(--acc-l);
  --on-accent: var(--ink-l);
  --hero: var(--hero-l);
  --chip: var(--food-l);
  --tone: color-mix(in srgb, var(--ink-l) 16%, transparent);
  --pos: #166534; --neg: #9D174D; --err: #B3261E;
  --nav: var(--paper-l);
  /* Header acetate (owner 2026-11-11): a cel tinted from the plate's second swatch, printed at 88% (no blur), its dots,
     an ink-drawn highlight on top, and a second cel behind it. --cel-sub: the plain grey fell under 4.5:1 on the tint. */
  --cel: color-mix(in srgb, color-mix(in srgb, var(--b2) 30%, var(--nav)) 88%, transparent);
  --cel-back: color-mix(in srgb, color-mix(in srgb, var(--b2) 60%, var(--nav)) 86%, transparent);
  --cel-dot: color-mix(in srgb, var(--ink-l) 26%, transparent);
  --glint: var(--paper-l); --bevel: color-mix(in srgb, var(--ink-l) 30%, transparent);
  --cel-sub: color-mix(in srgb, var(--fg) 72%, var(--b2));
  --cel-edge: var(--rule);
  /* Frosted cards on plain paper (owner 2026-11-11): a glass body tinted from the same second swatch, printed at 90%
     (nothing behind it to blur, so no backdrop-filter), a sheen kept inside the card, a light line under the top ink
     edge, a light rim and a shade line at the foot. --sub-f: grey words on the tint, a step toward ink (measured ≥5:1
     in 13 plates x 2 themes, top of the sheen included). --haze: the section's own marks, softer than inner cards. */
  --frost: color-mix(in srgb, color-mix(in srgb, var(--b2) 10%, var(--panel)) 90%, transparent);
  --sheen: color-mix(in srgb, var(--paper-l) 60%, transparent);
  --frost-hi: color-mix(in srgb, var(--paper-l) 90%, transparent);
  --frost-rim: color-mix(in srgb, var(--paper-l) 65%, transparent);
  --frost-lo: color-mix(in srgb, var(--ink-l) 8%, transparent);
  --sub-f: color-mix(in srgb, var(--sub) 80%, var(--fg));
  /* MATTE GLASS (owner 2026-11-12): calm two-tone paper, matte glass slabs. --g-*: the slab; --a-*: accent glass. */
  --page-a: color-mix(in srgb, var(--b2) 12%, var(--paper-l)); --page-b: color-mix(in srgb, var(--acc-l) 12%, var(--paper-l));
  --g-top: color-mix(in srgb, var(--b2) 6%, var(--paper-l));
  --g-foot: color-mix(in srgb, var(--b2) 16%, var(--paper-l));
  --g-edge: color-mix(in srgb, var(--b2) 30%, color-mix(in srgb, var(--ink-l) 24%, var(--paper-l)));
  --g-lip: color-mix(in srgb, var(--paper-l) 85%, transparent);
  --g-rim: color-mix(in srgb, var(--paper-l) 70%, transparent);
  --g-seam: color-mix(in srgb, var(--ink-l) 12%, transparent);
  --g-foot-line: color-mix(in srgb, var(--ink-l) 22%, transparent);
  --g-grain: color-mix(in srgb, var(--ink-l) 7%, transparent);
  --a-top: color-mix(in srgb, var(--accent) 18%, var(--paper-l));
  --a-foot: color-mix(in srgb, var(--accent) 32%, var(--paper-l));
  --a-edge: color-mix(in srgb, var(--accent) 78%, var(--ink-l) 22%);
  --b-top: color-mix(in srgb, var(--accent) 70%, var(--paper-l)); --b-foot: var(--accent);
  --g-bar: color-mix(in srgb, color-mix(in srgb, var(--b2) 10%, var(--paper-l)) 80%, transparent);
  --g-field-line: color-mix(in srgb, var(--ink-l) 58%, var(--paper-l));
  --g-shadow: color-mix(in srgb, var(--ink-l) 30%, transparent); --g-contact: color-mix(in srgb, var(--ink-l) 16%, transparent);
  --haze: color-mix(in srgb, var(--rule) 50%, transparent);
  /* Strip under the iOS status bar: black-translucent draws white clock text, so it stays dark in every theme (an ink band). */
  --sbar: var(--ink-l);

  --font-disp: 'Black Han Sans', 'Arial Black', Impact, sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 3px;
  /* Manga clay (pressable controls only): one corner, an inner light and an inner shade, mixed from the palette */
  --clay-r: 8px;
  --clay-hi: color-mix(in srgb, var(--paper-l) 70%, transparent);
  --clay-lo: color-mix(in srgb, var(--ink-l) 16%, transparent);
  --clay-sel: var(--clay-lo); /* shade inside the selected (inverted) .seg segment */
  /* Roles that dark mode sets apart; in light they equal what was there before */
  --off: var(--rule);            /* hard offset shadow */
  /* Depth by rank (owner, direction A "layered"): a hard 0-blur ink slab whose distance says how raised a thing is.
     Pressable controls 3px, cards and page panels 5px, the balance panel 8px (a dotted slab). A press lands on the slab. */
  --off-ctl: 3px; --off-card: 5px; --off-hero: 8px;
  --shade: color-mix(in srgb, var(--rule) 45%, var(--panel)); /* opaque dots of the card's shaded far edges */
  --sel-bg: var(--fg); --sel-fg: var(--bg); /* selected (inverted) segment */
  --sel-edge: var(--fg); /* inner ink edge on the selected .cat: in light the pastel alone is hue-only (1.29:1 in Fern) */
  --scrim: rgba(10, 10, 14, 0.5); --sheet: var(--bg); --field: var(--panel);
  /* Motion (hati-motion): one set of timings for everything. JS reads these too (motionTimes), so they live here only.
     Presses 90 ms, entrances 200, exits 160 (20% shorter), the screen wipe 260; list rows ink in 30 ms apart, capped at
     the 7th row so a long list never waits: 6 x 30 + 200 = 380 ms at most. */
  --dur-press: 90ms; --dur-in: 200ms; --dur-out: 160ms; --dur-wipe: 260ms; --stagger: 30ms;
  --ease-out: cubic-bezier(.2, .8, .2, 1); --ease-in: cubic-bezier(.55, 0, .75, .2); --ease-in-out: cubic-bezier(.65, 0, .35, 1);
  color-scheme: light; /* native controls (checkbox, pickers, keyboard) follow the app's Light, not a dark OS */
}
/* Dark: ink on night paper. Written once: build.py copies everything between the DARK markers into
   @media (prefers-color-scheme: dark) with :root:not([data-theme="light"]), so the two can't drift.
   Night paper is one near-neutral night with a 5% whisper of the plate's ink (max-min RGB spread <= 14 in every plate:
   at 20% Lagoon was violet, Peony indigo, Harbor maroon, so those plates read as another app). The plate shows in dark
   through the accent (primary, spines, focus), the category pastel and the hero, not the page. Layers step up bg < sunk < panel < hero < selected,
   mixed from chalk (--fg) into the night. The hero alone takes an 11% whisper of the accent over the panel (16% turned
   yellow/orange plates olive/brown mud). Frames and the offset slab are chalk at 62%, quieter than text: the slab is
   chalk ink, a manga negative panel (at 20% it vanished, 1.03:1 on the hero). Web dark no longer reads HatiPalette.kt heroD (see Team log). */
:root[data-theme="dark"] {
  --bg: color-mix(in srgb, var(--ink-l) 5%, #0E0D12);
  --fg: #EDEBE4; --sub: #A8A6B0; --label: #A8A6B0;
  --sunk: color-mix(in srgb, var(--fg) 3.5%, var(--bg));
  --panel: color-mix(in srgb, var(--fg) 11%, var(--bg));
  --line: color-mix(in srgb, var(--fg) 38%, var(--panel));
  --rule: color-mix(in srgb, var(--fg) 62%, var(--bg));
  --off: var(--rule); /* the slab is chalk ink, like light: a manga negative panel */
  --accent: var(--acc-d); --on-accent: #131217;
  --hero: color-mix(in srgb, var(--accent) 11%, var(--panel));
  --sel-bg: var(--fg); --sel-fg: var(--bg); /* chalk on night: the same inversion as light, no accent so no mud */
  --sel-edge: transparent; /* dark: the full pastel on night already stands 5.8:1 apart */
  --shade: color-mix(in srgb, var(--rule) 50%, var(--panel));
  --chip: var(--food-l); /* the plate's pastel at full strength (never diluted into the night, which turns it brown) */
  --tone: color-mix(in srgb, var(--fg) 16%, transparent);
  --pos: #BBF7D0; --neg: #FBCFE8; --err: #F2B8B5; --nav: var(--panel); --sbar: var(--bg);
  --scrim: rgba(0, 0, 0, 0.7); --sheet: var(--panel); --field: var(--sunk);
  --cel: color-mix(in srgb, color-mix(in srgb, var(--b2) 12%, var(--panel)) 88%, transparent);
  --cel-back: color-mix(in srgb, color-mix(in srgb, var(--b2) 22%, var(--panel)) 86%, transparent);
  --cel-dot: color-mix(in srgb, var(--fg) 24%, transparent);
  --glint: color-mix(in srgb, var(--fg) 60%, transparent); --bevel: color-mix(in srgb, #000 50%, transparent);
  --cel-sub: color-mix(in srgb, var(--fg) 88%, var(--bg));
  --cel-edge: color-mix(in srgb, var(--fg) 40%, var(--rule)); /* the chalk rule fell to 3.6:1 on the tinted night cel; ≥5.3:1 now, still under the text */
  /* frosted cards at night: a 6% tint, a faint chalk sheen (5%: more would lift the text's ground), chalk light lines */
  --frost: color-mix(in srgb, color-mix(in srgb, var(--b2) 6%, var(--panel)) 90%, transparent);
  --sheen: color-mix(in srgb, var(--fg) 5%, transparent);
  --frost-hi: color-mix(in srgb, var(--fg) 16%, transparent);
  --frost-rim: color-mix(in srgb, var(--fg) 8%, transparent);
  --frost-lo: color-mix(in srgb, #000 35%, transparent);
  --clay-hi: color-mix(in srgb, var(--fg) 10%, transparent); --clay-lo: color-mix(in srgb, #000 45%, transparent);
  --clay-sel: color-mix(in srgb, var(--bg) 10%, transparent);
  --page-a: color-mix(in srgb, var(--b2) 16%, var(--bg)); --page-b: color-mix(in srgb, var(--acc-d) 7%, var(--bg));
  --g-top: color-mix(in srgb, var(--b2) 5%, var(--panel));
  --g-foot: color-mix(in srgb, var(--b2) 10%, var(--panel));
  --g-edge: color-mix(in srgb, var(--b2) 22%, color-mix(in srgb, var(--fg) 26%, var(--bg)));
  --g-lip: color-mix(in srgb, var(--fg) 24%, transparent);
  --g-rim: color-mix(in srgb, var(--fg) 10%, transparent);
  --g-seam: color-mix(in srgb, #000 40%, transparent);
  --g-foot-line: color-mix(in srgb, #000 55%, transparent);
  --g-grain: color-mix(in srgb, var(--fg) 5%, transparent);
  --a-top: color-mix(in srgb, var(--accent) 12%, var(--panel));
  --a-foot: color-mix(in srgb, var(--accent) 20%, var(--panel));
  --a-edge: color-mix(in srgb, var(--accent) 70%, var(--bg));
  --b-top: color-mix(in srgb, var(--accent) 88%, var(--fg)); --b-foot: var(--accent);
  --g-bar: color-mix(in srgb, color-mix(in srgb, var(--b2) 6%, var(--panel)) 82%, transparent);
  --g-field-line: color-mix(in srgb, var(--fg) 58%, var(--bg));
  --g-shadow: color-mix(in srgb, #000 62%, transparent); --g-contact: color-mix(in srgb, #000 40%, transparent);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; background: var(--bg); }
body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sbar); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; box-shadow: 0 0 0 6px var(--accent); }
h1, h2 { text-wrap: balance; }

#app {
  max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(24px + env(safe-area-inset-bottom, 0px));
  min-height: 100%;
}

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 10px; min-height: 70px;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 24px;
  padding: 10px max(16px, env(safe-area-inset-left, 0px));
  --sub: var(--cel-sub);
  /* Manga acetate (owner 2026-11-11, "Number 2"; the header only, cards stay solid): a tinted cel at 88% (the page shows
     faintly through, never blurred), two rows of tone dots printed along its foot (clear of the words), an ink-drawn
     highlight on the top edge (a 2px light line over a 1px ink line, no gradient), the 2px ink edge, a 3px hard slab under it. */
  background: radial-gradient(circle, var(--cel-dot) 1px, transparent 1.4px) 0 calc(100% - 1px) / 4px 4px repeat-x,
    radial-gradient(circle, var(--cel-dot) .7px, transparent 1.1px) 2px calc(100% - 5px) / 4px 4px repeat-x, var(--cel);
  border-bottom: 2px solid var(--cel-edge);
  box-shadow: inset 0 2px 0 var(--glint), inset 0 3px 0 var(--bevel), 0 var(--off-ctl) 0 var(--off);
}
/* The second cel behind it, for 3D stacking: a dotted strip of the deeper tint under the slab, framed by its own ink line.
   Drawn once: nothing changes while the page scrolls under it. */
.topbar::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 10px; margin-top: calc(2px + var(--off-ctl)); pointer-events: none;
  border-bottom: 2px solid var(--cel-edge); background: radial-gradient(circle, var(--cel-dot) 1px, transparent 1.4px) 0 1px / 4px 4px, var(--cel-back); }
.topbar h1 { flex: 1; min-width: 0; margin: 0; font: 400 1.35rem/1.1 var(--font-disp); letter-spacing: .02em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.topbar h1:focus, .topbar h1:focus-visible { outline: none; box-shadow: none; }
.topbar .sub { font-size: .85rem; max-width: 40%; }
@media (max-width: 420px) { .topbar .sub { display: none; } }
.logo { width: 36px; height: 36px; border-radius: var(--r); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 400 .95rem var(--font-disp); flex-shrink: 0; border: 2px solid var(--rule); }
.logo svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; }
.ico { width: 44px; height: 44px; background: var(--panel); border: 2px solid var(--rule); display: grid; place-items: center; flex-shrink: 0; }
.ico svg, .btn svg, .tx-ic svg, .cat svg, .ck svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tagline { margin: 0 0 4px; font-size: .95rem; color: var(--sub); }

/* Generic structure */
.stack { display: flex; flex-direction: column; gap: 12px; }
section { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.panel { background: var(--panel); border: 2px solid var(--rule); border-radius: var(--r); }
/* Card rank (5px slab, never clay shading: reading surfaces stay flat paper) on every card-like block: page panels and
   ledgers, the expense form's amount box, and the ledgers, panels and summaries inside sheets (owner 2026-11-11: no flat sheets). */
#app :is(.panel, .ledger, .amount-box), .sheet :is(.panel, .ledger, .share-sum) { box-shadow: var(--off-card) var(--off-card) 0 var(--off); }
/* Section cards with inner cards (owner 2026-11-11): each screen groups its content into big frosted section cards
   (5px slab); what sits inside (ledgers, panels, volume cards, the amount box) is an inner card: solid, lighter fill,
   the same top light, the control slab (3px), so nesting reads front to back. Every light and shade line is 0-blur;
   the soft part is the sheen, a gradient that never leaves the card. */
.sect { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 12px; min-width: 0; border: 2px solid var(--rule); border-radius: var(--r);
  --sub: var(--sub-f);
  /* the sheen is a 40px tile, not a gradient the height of the card: a tall section (a month of history) otherwise
     rasterises a full-height gradient on each screen change (M-perf 4x: long tasks 52-66 ms) */
  background: linear-gradient(var(--sheen), transparent) 0 0 / 100% 40px no-repeat, var(--frost);
  box-shadow: inset 0 2px 0 var(--frost-hi), inset 0 -2px 0 var(--frost-lo), inset 0 0 0 1px var(--frost-rim), var(--off-card) var(--off-card) 0 var(--off); }
#app .sect :is(.panel, .ledger, .amount-box) { box-shadow: inset 0 2px 0 var(--frost-hi), var(--off-ctl) var(--off-ctl) 0 var(--off); }
.sect .vol { --c-lift: var(--off-ctl); }
.sect .arch-box, .sect .arch-box > summary { margin-top: 0; margin-bottom: 0; }
#app > .sect { margin-top: 12px; }
.sect .pad { padding: 12px; }
/* Divider strip between groups (manga, not a grey hairline): the label, then an ink rule with a screentone band
   hanging from it (heavy dots under the rule, light ones below). Hazed: the section's marks sit behind the inner cards. */
.strip { display: flex; align-items: center; gap: 8px; min-height: 28px; }
/* the strip names what follows it: 8px to its content, not the section's 12px (keeps the hub's first volume high under the iOS hint) */
.sect > .strip { margin-bottom: -4px; }
.strip > .label { margin: 0; flex: 0 1 auto; min-width: 0; }
.strip > :not(.label) { order: 2; flex: none; }
.strip::after { content: ""; order: 1; flex: 1 1 24px; min-width: 24px; height: 10px; border-top: 2px solid var(--haze);
  background: radial-gradient(circle, var(--haze) 1px, transparent 1.4px) 0 0 / 4px 4px repeat-x,
    radial-gradient(circle, var(--haze) .7px, transparent 1.1px) 2px 4px / 4px 4px repeat-x; }
/* Inside a section card the category grid is 24px narrower: 68px tiles keep 4 across from 360px (3 at 320) */
.sect .cats { grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); }
.sect .cat { padding: 6px 2px; } /* two-line labels ("Stay & rent") keep the 360 grid ≤220px tall */
.pad { padding: 14px; }
.label { margin: 18px 0 2px; font: 400 1.05rem/1.2 var(--font-disp); letter-spacing: .02em; color: var(--fg); }
section > .label, section > .row > .label { margin-top: 6px; }
.muted { color: var(--sub); }
.small { font-size: .85rem; }
.num { font-variant-numeric: tabular-nums; }
:is(span, b, div).num, .money { white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.ellip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.date { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Manga clay: only pressable things are clay. A flat palette fill (no gradients) with an inner light top-left and an
   inner shade bottom-right, the 2px ink outline and the hard 0-blur ink offset. Pressed: the offset drops to 0, the shade
   grows and the body moves 3px (the move is dropped under reduced motion, the shading stays). Reading surfaces stay flat 3px. */
.btn, .ico, .cat, .vol, button.chip:not(.add) {
  --c-lift: var(--off-ctl); --c-x: var(--c-lift); --c-in: 0px; --c-off: var(--off); --c-hi: var(--clay-hi); --c-lo: var(--clay-lo);
  --clay: inset 2px 2px 3px var(--c-hi), inset -3px -3px 4px var(--c-lo), inset var(--c-in) var(--c-in) calc(2 * var(--c-in)) var(--c-lo), var(--c-x) var(--c-x) 0 var(--c-off);
  border-radius: var(--clay-r); box-shadow: var(--clay); transition: transform .08s, box-shadow .08s;
}
.btn:active, .ico:active, .cat:active, .vol:active, button.chip:not(.add):active { --c-x: 0px; --c-in: 3px; transform: translate(var(--c-lift), var(--c-lift)); }
.cat[aria-pressed="true"] { --c-x: 0px; --c-in: 3px; box-shadow: inset 0 0 0 2px var(--sel-edge), var(--clay); }
.btn {
  min-height: 44px; border: 2px solid var(--rule);
  background: var(--panel); padding: 10px 14px;
  font-weight: 700; font-size: .9rem; line-height: 20px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.quiet, .btn.text { --clay: 0 0 #0000; box-shadow: none; }
.btn.quiet:active { transform: none; background: var(--sunk); }
.btn.text { border-color: transparent; background: transparent; border-radius: var(--r); }
.btn.text:active { transform: none; background: var(--sunk); }
.btn.danger { color: var(--err); border-color: var(--err); --c-off: var(--err); --c-lo: color-mix(in srgb, var(--err) 30%, transparent); }
.btn.block { width: 100%; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btns.acts > :first-child { grid-column: 1 / -1; }
@media (max-width: 360px) { .btns:not(.pair) { grid-template-columns: 1fr; } }

/* Hub: volumes as numbered spines */
.vol { --c-lift: var(--off-card); display: grid; grid-template-columns: 64px 1fr; text-align: left; padding: 0; width: 100%; overflow: hidden; background: var(--panel); border: 2px solid var(--rule); }
.spine { box-shadow: inset 2px 2px 3px var(--clay-hi), inset -3px -3px 4px var(--clay-lo); background: var(--accent); color: var(--on-accent); border-right: 2px solid var(--rule); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 10px 4px; }
.spine span { font-size: .68rem; font-weight: 700; letter-spacing: .12em; }
.spine b { font: 400 1.6rem/1 var(--font-disp); }
.vol-info { padding: 12px 14px; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
/* Shade on the card's far edges (light from the top left): two rows of dots along the right and the bottom, an L with
   no ruled edge, so it reads as the shaded side of a raised card, not as a scrollbar. Opaque dots: the corner overlap is invisible. */
.vol-info { --d: radial-gradient(circle, var(--shade) 1px, transparent 1.4px);
  background: var(--d) right 0 bottom 0 / 4px 4px repeat-y, var(--d) right 4px bottom 0 / 4px 4px repeat-y,
    var(--d) right 0 bottom 0 / 4px 4px repeat-x, var(--d) right 0 bottom 4px / 4px 4px repeat-x; }
.vol-name { font: 400 1.1rem/1.2 var(--font-disp); letter-spacing: .02em; overflow-wrap: anywhere; }
/* Card meta wraps between its parts (never inside "¥48,000.00 spent"), so nothing on the first screen is cut off */
.vol-meta > span { white-space: nowrap; }
.vol-meta > span:last-child { white-space: normal; } /* a huge total wraps before "spent", never inside the amount */
/* Separator dots belong to the part after them; the row starts .9em left and clip-path hides that strip, so a dot that
   lands at a line start is cut and none hangs at a line end */
.vol-meta { display: flex; flex-wrap: wrap; margin-left: -.9em; clip-path: inset(0 0 0 .9em); }
.vol-meta > span::before { content: "·"; display: inline-block; width: .9em; text-align: center; }
.vol-bal { font-weight: 700; font-size: .95rem; }
.vol-info .vol-bal { white-space: normal; }
.vol-bal.pos { color: var(--pos); } .vol-bal.neg { color: var(--neg); } .vol-bal.even { color: var(--sub); }
.dashed { border: 2px dashed var(--line); border-radius: var(--r); background: transparent; padding: 16px; width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; }
.dashed b { font-size: 1rem; display: block; }
/* No volumes yet: the one action on the first screen is drawn as the panel the page points at */
.stack > .dashed:only-child { --panel: var(--bg); min-height: 150px; justify-content: center; border-color: var(--rule); background: var(--speed); }
.stack > .dashed:only-child > span:last-child { background: var(--bg); padding: 2px 6px; }
/* A card and its options button (hidden until it has keyboard focus, then a clay .ico on the card's top-right) */
.volw { position: relative; border-radius: var(--clay-r); }
.vol { position: relative; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.vol-more { position: absolute; top: 8px; right: 8px; background: var(--panel); }
.vol-more:not(:focus) { width: 1px; height: 1px; min-height: 0; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); box-shadow: none; }
/* Archived: a shelf at the bottom, closed by default; an archived spine is plain paper, not the plate's accent */
.arch-box { margin-top: 8px; }
.arch-box > summary { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; list-style: none; width: max-content; }
.arch-box > summary::-webkit-details-marker { display: none; }
.arch-box > summary::before { content: ""; border-left: 7px solid currentColor; border-block: 6px solid transparent; transition: transform .1s; }
.arch-box[open] > summary::before { transform: rotate(90deg); }
.arch-box > .stack { margin-top: 4px; }
.vol.arch .spine { background: var(--sunk); color: var(--fg); }
.arch-note { gap: 12px; }
/* Edit volume: one line per member, × marks a removal (struck through until Save) */
.mems { padding: 4px 0; }
.mem-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.mem-row .input { flex: 1; min-width: 0; }
.mem-row.drop .input { text-decoration: line-through; }
.mem-row .ico[aria-pressed="true"] { --c-x: 0px; --c-in: 3px; background: var(--sunk); }

/* Volume: balance panel with screentone */
/* The top rank: an 8px dotted slab (::after, clipped to the L that shows beside and under the panel) and a screentone
   ramp, fine dots to heavy ones toward the right edge, one column of dots per layer (no mask, no fade). Nine columns, 54px:
   the panel's right padding is 32px, so text only ever meets the light columns (dots ≤1.05px), never the heavy 30px. */
.hero { position: relative; padding: 16px 32px 14px 16px; border: 2px solid var(--rule); border-radius: var(--r); --t: var(--tone);
  /* frosted like the cards (owner 2026-11-11): the sheen over its top, a light line and rim inside the ink, all 0-blur */
  box-shadow: inset 0 2px 0 var(--frost-hi), inset 0 0 0 1px var(--frost-rim);
  background: linear-gradient(var(--sheen), transparent) 0 0 / 100% 40px no-repeat,
    radial-gradient(circle, var(--t) 2.4px, transparent 2.8px) right 0 top 0 / 6px 6px repeat-y,
    radial-gradient(circle, var(--t) 2.1px, transparent 2.5px) right 6px top 0 / 6px 6px repeat-y,
    radial-gradient(circle, var(--t) 1.8px, transparent 2.2px) right 12px top 0 / 6px 6px repeat-y,
    radial-gradient(circle, var(--t) 1.5px, transparent 1.9px) right 18px top 0 / 6px 6px repeat-y,
    radial-gradient(circle, var(--t) 1.25px, transparent 1.65px) right 24px top 0 / 6px 6px repeat-y,
    radial-gradient(circle, var(--t) 1.05px, transparent 1.45px) right 30px top 0 / 6px 6px repeat-y,
    radial-gradient(circle, var(--t) .9px, transparent 1.3px) right 36px top 0 / 6px 6px repeat-y,
    radial-gradient(circle, var(--t) .75px, transparent 1.15px) right 42px top 0 / 6px 6px repeat-y,
    radial-gradient(circle, var(--t) .6px, transparent 1px) right 48px top 0 / 6px 6px repeat-y,
    var(--hero); }
.hero::after { content: ""; position: absolute; top: calc(var(--off-hero) - 2px); left: calc(var(--off-hero) - 2px); right: calc(-2px - var(--off-hero)); bottom: calc(-2px - var(--off-hero)); pointer-events: none;
  border: 2px solid var(--rule); border-radius: var(--r); background: radial-gradient(circle, var(--rule) 1.1px, transparent 1.5px) 0 0 / 4px 4px, var(--bg);
  clip-path: polygon(calc(100% - var(--off-hero)) 0, 100% 0, 100% 100%, 0 100%, 0 calc(100% - var(--off-hero)), calc(100% - var(--off-hero)) calc(100% - var(--off-hero))); }
.hero > * { position: relative; }
.hero .k { font-weight: 700; font-size: .95rem; }
/* All settled: the line itself is pressed on like a rubber stamp (double ink rule, display face, off true), no extra words */
.hero .k.settled { display: inline-block; margin: 6px 0 4px; padding: 5px 10px 4px; border: 4px double var(--fg); border-radius: var(--r); font: 400 1.2rem/1.15 var(--font-disp); letter-spacing: .02em; transform: rotate(-3deg); transform-origin: 0 50%; }
.hero .amt { font: 400 clamp(1.9rem, 10vw, 2.6rem)/1.1 var(--font-disp); letter-spacing: .01em; margin: 2px 0 6px; }
.hero .amt.long { font-size: 1.6rem; }
.hero .amt.longer { font-size: 1.25rem; }
.amt .fig { display: inline-block; } /* the figure moves on its own when the balance rolls; the line keeps its box */
.hero .meta { font-size: .85rem; color: color-mix(in srgb, var(--fg) 72%, var(--hero)); }
@media (max-width: 379px) { .hero .vno { display: none; } }
/* The rule over "Pay …" is drawn in the text ink: in dark the 62% chalk frame was 3.8-4.4:1 on the hero; ink is 4.5+ in every plate */
.hero .mine { margin: 8px 0 0; padding: 8px 0 0; border-top: 2px solid var(--fg); display: flex; flex-direction: column; gap: 4px; font-size: .92rem; list-style: none; }
.amt.pos, .k.pos { color: var(--pos); } .amt.neg, .k.neg { color: var(--neg); }
/* Live sync status: one small ink line in the hero. The square is a stamp: filled = synced, open = waiting, red = stuck. */
.hero .sync { display: flex; align-items: center; gap: 7px; margin: 10px 0 0; font-size: .8rem; font-weight: 600; color: color-mix(in srgb, var(--fg) 72%, var(--hero)); }
.sync i { width: 9px; height: 9px; flex: none; border: 2px solid var(--fg); background: transparent; }
.sync[data-s="ok"] i { background: var(--fg); }
.sync[data-s="bad"] i, .sync[data-s="big"] i { border-color: var(--neg); background: var(--neg); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.mem-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }
.chips.mem-row { padding: 0; margin: 0; display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); gap: 8px; }
.mem-row > .chip { min-width: 0; width: 100%; margin: 0; overflow: hidden; overflow-wrap: anywhere; }
.mem-row > .chip:has(> .av) { grid-template-columns: auto minmax(0, 1fr); } /* name column right after the avatar in every chip */
.mem-row > .chip.add { justify-content: center; }
.mem-row > .chip > :not(.av) { min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--panel); font-size: .9rem; font-weight: 600; }
.chip .num { font-weight: 500; }
.chip.add { padding: 4px 14px; min-height: 44px; border: 2px dashed var(--line); background: transparent; }
button.chip { min-height: 44px; text-align: left; }
button.chip:not(.add) { border: 2px solid var(--rule); }
button.chip:active { background: var(--sunk); }
/* Member chips: the name over the amount beside the avatar, so two sit to a row at 360 inside a section card */
.chip:has(> .av) { display: inline-grid; grid-template-columns: auto auto; column-gap: 8px; align-items: start; align-content: center; justify-items: start; line-height: 1.2; }
.chip:has(> .av) > .av { grid-row: span 2; align-self: center; }
.chips.sug:not(:empty) { margin-top: 8px; }
.chips.sug .chip { padding: 4px 12px 4px 8px; max-width: 100%; }
.chips.sug .chip svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#lastAmt:not(:empty) { margin-top: 8px; }
#lastAmt .chip { padding: 4px 12px; background: var(--panel); }
/* D9 paste a receipt: a quiet line and, when unclear, up to 3 amounts as the same clay chips */
#pasteMsg { margin: 8px 0 0; font-weight: 600; }
#pasteMsg:empty { display: none; }
#pasteSug:not(:empty) { margin-top: 8px; }
#pasteSug .chip { padding: 4px 14px; background: var(--panel); }
/* N5: Today / Yesterday under a date field, pressed = the day it holds (the same inverted fill as the other toggles) */
.qd, .qh { margin-top: 8px; }
.qd .chip, .qh .chip { padding: 4px 14px; }
.qd .chip[aria-pressed="true"], .qh .chip[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-fg); }
/* N5 Set dates: a chosen row gets an ink bar at its left edge and an inverted icon tile (not color alone) */
.hist.selecting .tx[aria-pressed="true"] { background: var(--sunk); box-shadow: inset 4px 0 0 var(--fg); }
.hist.selecting .tx[aria-pressed="true"] .tx-ic { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.setdate { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; margin-top: 12px; }
.btn:disabled { opacity: .55; --clay: 0 0 #0000; box-shadow: none; cursor: not-allowed; }
.btn:disabled:active { transform: none; }
.av { width: 30px; height: 30px; border-radius: var(--r); display: grid; place-items: center; font-size: .75rem; font-weight: 700; color: var(--on-accent); border: 1.5px solid var(--rule); flex-shrink: 0; }

/* Ledger: ruled rows inside one panel */
.ledger { background: var(--panel); border: 2px solid var(--rule); border-radius: var(--r); display: flex; flex-direction: column; }
.ledger > * + * { border-top: 1px solid var(--line); }
.tx, .debt { display: flex; align-items: center; gap: 12px; padding: 12px; width: 100%; min-height: 56px; text-align: left; background: transparent; border: 0; }
.ck { display: inline-flex; flex: none; color: var(--fg); }
[data-sugg][aria-pressed="false"] .ck { visibility: hidden; }
.ledger > .tx + .tx, .ledger > .debt + .debt, .ledger > * + .tx, .ledger > * + .debt { border-top: 1px solid var(--line); }
button.tx:active, button.debt:active { background: var(--sunk); }
.tx-ic { width: 36px; height: 36px; border-radius: var(--r); display: grid; place-items: center; border: 1.5px solid var(--rule); background: var(--sunk); flex-shrink: 0; }
.tx-a { font-weight: 700; white-space: nowrap; }
/* History/recent rows, read like a ledger line: what + who paid on the left (wrapping, title up to 2 lines, full text on
   the edit screen), amount over date in the right column. Icon, title and amount share line 1. */
.tx { align-items: flex-start; }
/* A long history lays out and paints only the rows near the screen. The first 32 are always drawn: that reaches past
   the browser's look-ahead margin, so the first frame of the wipe never has to lay out rows that just came into range.
   A focused row is drawn whole so its focus ring isn't clipped. Rows keep their last measured height once seen. */
.month-tot { font-weight: 700; font-size: .95rem; }
.hfilter { margin: 0 0 12px; }
.hf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hf-row > .field { min-width: 0; }
.ledger.hist > .cv:not(:focus-within) { content-visibility: auto; contain-intrinsic-size: auto 64px; } /* .cv: 33rd row on, across the month cards */
.tx-t { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.tx-m { display: block; overflow-wrap: anywhere; }
.tx-r { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; align-self: stretch; justify-content: space-between; }
.who { display: flex; gap: .3em; min-width: 0; white-space: nowrap; }
.who > .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.who > :not(.nm) { flex: none; }
.who > .nm ~ .nm { flex-shrink: 0; max-width: 45%; }
/* X1 At a glance: one panel, three ruled blocks; ink bars, the accent only on this month / today */
.glance { padding: 4px 12px; }
.gl-b { padding: 12px 0; display: grid; gap: 8px; }
.gl-b + .gl-b { border-top: 1px solid var(--line); }
.gl-b .legend { margin: 0; }
.gl-say { margin: 0; }
.gl-bars, .gl-who, .gl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.gl-bars li { display: grid; gap: 4px; }
.bar.now i { background: var(--accent); box-shadow: inset 0 0 0 1.5px var(--rule); }
.gl-cols { height: 72px; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 2px; align-items: end; border-bottom: 2px solid var(--rule); }
.gl-cols i { display: block; background: var(--fg); min-height: 0; }
.gl-cols i.now { background: var(--accent); box-shadow: inset 0 0 0 1.5px var(--rule); }
.gl-ends { margin-top: -2px; }
.gl-who li { display: grid; gap: 2px; }
.gl-list { gap: 6px; margin-top: 8px; }
.stamp-s { display: inline-block; margin-left: 6px; padding: 0 6px; border: 2px solid var(--rule); font: 400 .72rem/1.4 var(--font-disp); letter-spacing: .03em; transform: rotate(-3deg); vertical-align: 1px; }
.bars { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.bar { height: 10px; border: 1.5px solid var(--rule); border-radius: 1px; background: var(--panel); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--fg); }
/* Nothing here yet: manga's own "look here", concentration lines (two spacings, so they read as drawn, not as a
   pattern) that stop at a cleared paper ellipse round the kaomoji; the words keep their own paper chip. Hard stops only. */
.empty, .stack > .dashed:only-child { --speed: radial-gradient(ellipse 34% 40% at 50% 50%, var(--panel) 99%, transparent 100%),
    repeating-conic-gradient(from 2deg at 50% 50%, var(--shade) 0 .9deg, transparent .9deg 7deg),
    repeating-conic-gradient(from 5deg at 50% 50%, var(--shade) 0 .5deg, transparent .5deg 11deg); }
.empty { text-align: center; padding: 20px 16px; background: var(--speed), var(--panel); }
.empty .kao { font: 400 1.3rem var(--font-disp); }
.empty .muted { background: var(--panel); display: inline-block; padding: 2px 8px; margin-top: 4px; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .legend { font-size: .85rem; font-weight: 700; color: var(--fg); }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
legend { padding: 0; margin-bottom: 6px; }
.input, textarea.input { width: 100%; height: calc(1.5em + 24px); padding: 10px 12px; border-radius: var(--r); font-size: 16px; border: 2px solid var(--line); background: var(--field); outline: none; -webkit-appearance: none; appearance: none; }
textarea.input { height: auto; }
.input:focus { border-color: var(--rule); }
.input[aria-invalid="true"] { border-color: var(--err); }
.input:disabled { background: var(--sunk); color: var(--sub); }
.amount-box { padding: 12px 14px; background: var(--hero); border: 2px solid var(--rule); border-radius: var(--r); }
.amount-box:focus-within { outline: 3px solid var(--fg); outline-offset: 2px; }
.amount-box .row { gap: 6px; }
.amount-box .cur { font: 400 1.6rem var(--font-disp); }
.amount-box input { flex: 1; min-width: 0; min-height: 44px; font: 400 2.2rem/1.1 var(--font-disp); background: transparent; border: none; outline: none; padding: 0; }
.seg { display: flex; flex-wrap: wrap; border: 2px solid var(--rule); border-radius: var(--clay-r); overflow: hidden; box-shadow: var(--off-ctl) var(--off-ctl) 0 var(--off); }
.seg button { flex: 1 1 auto; min-height: 44px; border: none; background: var(--panel); padding: 8px 4px; font-size: .9rem; font-weight: 700; color: var(--fg); box-shadow: inset 2px 2px 3px var(--clay-hi), inset -3px -3px 4px var(--clay-lo); }
.seg button + button { border-left: 2px solid var(--rule); }
/* Selected segment is pushed in: inverted fill, inner shade only (no inner light) */
.seg button:is([aria-pressed="true"], [aria-checked="true"]), .seg button:active { box-shadow: inset 3px 3px 5px var(--clay-lo); }
.seg button:is([aria-pressed="true"], [aria-checked="true"]) { background: var(--sel-bg); color: var(--sel-fg); box-shadow: inset 3px 3px 5px var(--clay-sel); }
.seg button:focus-visible { outline: 3px solid currentColor; outline-offset: -7px; box-shadow: inset 3px 3px 5px var(--clay-lo); }
.seg button:is([aria-pressed="true"], [aria-checked="true"]):focus-visible { box-shadow: inset 3px 3px 5px var(--clay-sel); }
@media (min-width: 350px) { .seg:has(> :nth-child(3)) { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; } }
/* Designed pickers (D0, <hati-pick>): a picker row never wraps; segments size to their words, and a row whose words
   don't fit becomes the clay button that opens an ink sheet list (HatiPick.fit). */
hati-pick { display: block; min-width: 0; }
.seg.pk, .seg.pk:has(> :nth-child(3)) { display: flex; flex-wrap: nowrap; }
.seg.pk > button { min-width: 0; padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* X4 Paid by grid: equal clay buttons per row, rows as even as possible; the chosen one is pushed in and inverted */
.pk-grid { display: grid; gap: 8px; }
.pk-row { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); gap: 8px; }
.btn.pkg { min-width: 0; padding: 8px 10px; font-size: .95rem; }
.btn.pkg > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn.pkg[aria-checked="true"] { --c-x: 0px; --c-in: 3px; transform: translate(var(--c-lift), var(--c-lift)); background: var(--sel-bg); color: var(--sel-fg); --c-hi: transparent; --c-lo: var(--clay-sel); }
@media (prefers-reduced-motion: reduce) { .btn.pkg[aria-checked="true"] { transform: none; } }
.btn.pick-btn { width: 100%; justify-content: space-between; text-align: left; font-size: 1rem; }
.pick-btn .pv { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-btn::after { content: ""; flex: none; width: 0; height: 0; border-top: 6px solid currentColor; border-inline: 5px solid transparent; }
.pk-scrim { z-index: 25; }
.pko { min-height: 48px; font-size: 1rem; justify-content: space-between; }
.pko[aria-selected="true"] { font-weight: 700; }
.pko[aria-selected="false"] .ck { visibility: hidden; }
.pko:active { background: var(--sunk); }
.pko:focus-visible { outline-offset: -5px; box-shadow: none; }
/* 12 categories: 4 across from 360 px (3 rows), 3 across on a 320 px phone (4 rows); one tap, no scrolling inside */
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
.cat { border: 2px solid var(--rule); background: var(--panel); padding: 8px 4px; min-height: 58px; font-size: .8rem; line-height: 1.15; font-weight: 600; display: grid; justify-items: center; align-content: center; gap: 4px; text-align: center; }
.cat[aria-pressed="true"] { background: var(--chip); }
.split-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 12px; min-height: 52px; }
.split-row.typed { grid-template-columns: auto minmax(0, 1fr); }
.split-row.typed > .row:last-child { grid-column: 2; justify-content: flex-end; }
.split-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--fg); }
.split-row .share { text-align: right; font-weight: 700; white-space: nowrap; }
.split-row .input { width: 110px; height: auto; padding: 8px 10px; text-align: right; }
.split-in { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.msg { font-size: .9rem; font-weight: 600; color: var(--err); min-height: 1.2em; }
.msg.ok { color: var(--pos); }
.stack > .msg:empty, .stack > [aria-live]:empty, .stack > #s-pick:empty, .sect > [aria-live]:empty { min-height: 0; margin-top: -12px; }
.field > .msg:empty { min-height: 0; margin-top: -6px; }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
/* A sheet is an edge panel, the header mirrored: a 3px ink top edge and an 8px screentone band cast toward the page
   centre (heavy dots by the edge, a lighter offset row above). The band is the scrim's, because the sheet scrolls (its
   overflow would clip it); it rides up with the sheet and is hidden in the closing ghost (:host). Static, no blur. */
.scrim::before { content: ""; flex: none; width: 100%; max-width: 520px; height: 8px; pointer-events: none;
  background: radial-gradient(circle, var(--rule) 1.3px, transparent 1.7px) 0 4px / 4px 4px repeat-x,
    radial-gradient(circle, var(--rule) .8px, transparent 1.2px) 2px 0 / 4px 4px repeat-x; }
:host .scrim::before { display: none; }
.sheet {
  width: 100%; max-width: 520px; max-height: min(88%, var(--vvh, 100dvh)); overflow: auto; overscroll-behavior: contain;
  border-radius: 6px 6px 0 0; border: 2px solid var(--rule); border-top-width: 3px; border-bottom: none;
  /* frosted top (owner 2026-11-11): the sheen and a light line under the ink edge; the body stays opaque (text on it) */
  background: linear-gradient(var(--sheen), transparent) 0 0 / 100% 48px no-repeat, var(--sheet); box-shadow: inset 0 2px 0 var(--frost-hi);
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet h2 { margin: 0 0 12px; font: 400 1.35rem var(--font-disp); letter-spacing: .02em; }
.sheet h2:focus, .sheet h2:focus-visible { outline: none; box-shadow: none; }

/* Settings palettes: a grid of printed swatch plates */
.pals { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; } /* 84: three across inside a section card at 360 (272px) */
.pal { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 6px 6px 7px; min-height: 64px; border-radius: var(--r); border: 2px solid var(--pi); background: var(--pp); color: var(--pi); text-align: left; }
.pal:first-child { grid-column: 1 / -1; }
.pal[aria-checked="true"] { box-shadow: var(--off-ctl) var(--off-ctl) 0 var(--off); }
.pal .n { color: var(--pm); }
.sw { display: flex; height: 18px; border: 1.5px solid currentColor; }
.sw i { flex: 1; }
.pal b { font-size: .85rem; line-height: 1.15; overflow-wrap: anywhere; }
.pal .n { font-size: .72rem; font-weight: 600; }
.pal .dot { position: absolute; right: 6px; bottom: 6px; width: 22px; height: 22px; color: var(--pi); border-radius: var(--r); border: 2px solid currentColor; display: grid; place-items: center; font-size: .8rem; font-weight: 700; }
.share-sum { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 2px solid var(--rule); border-radius: var(--r); background: var(--panel); min-width: 0; }
.share-sum b { font: 400 1.1rem/1.2 var(--font-disp); letter-spacing: .02em; }
#s-code { resize: none; }
/* QR: ink on white in every theme (scanners need it), never wider than 280px. Corner ticks on a frame around it say
   "scan this" (a viewfinder); the white and the QR itself stay untouched inside them. */
.qr { display: block; width: 100%; height: auto; background: #fff; }
.qr-frame { width: min(100%, 300px); margin: 0 auto; padding: 10px; --tk: linear-gradient(var(--fg), var(--fg));
  background: var(--tk) 0 0 / 22px 3px, var(--tk) 0 0 / 3px 22px, var(--tk) 100% 0 / 22px 3px, var(--tk) 100% 0 / 3px 22px,
    var(--tk) 0 100% / 22px 3px, var(--tk) 0 100% / 3px 22px, var(--tk) 100% 100% / 22px 3px, var(--tk) 100% 100% / 3px 22px;
  background-repeat: no-repeat; }
.codebox summary { min-height: 44px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .9rem; cursor: pointer; list-style: none; }
.codebox summary::-webkit-details-marker { display: none; }
.codebox summary::before { content: ""; width: 0; height: 0; border-left: 6px solid currentColor; border-block: 5px solid transparent; transition: transform .1s; }
.codebox[open] summary::before { transform: rotate(90deg); }
.filepick { flex-wrap: wrap; }
.filepick:focus-within .btn { outline: 3px solid var(--fg); outline-offset: 2px; }
.banner { font-size: .9rem; padding: 10px 12px; margin-top: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; padding: 10px 14px; border-radius: var(--r); background: var(--fg); color: var(--bg); font-size: .9rem; font-weight: 700; line-height: 1.35; text-align: left; width: max-content; max-width: min(calc(100vw - 32px), 480px); white-space: normal; overflow-wrap: anywhere; box-shadow: var(--off-card) var(--off-card) 0 var(--accent); }
.toast.top { top: calc(12px + env(safe-area-inset-top, 0px)); bottom: auto; }
.toast.has-undo { display: flex; align-items: center; gap: 12px; }
.toast .undo { flex: none; min-height: 44px; min-width: 44px; margin: -10px -6px; padding: 0 8px; border: 0; background: none; color: inherit; font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.toast .undo:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
/* Focus on clay: the ring joins the clay stack instead of replacing it */
:is(.btn, .ico, .cat, .vol, button.chip:not(.add)):focus-visible { box-shadow: var(--clay), 0 0 0 6px var(--accent); }
:root .cat[aria-pressed="true"]:focus-visible { box-shadow: inset 0 0 0 2px var(--sel-edge), var(--clay), 0 0 0 6px var(--accent); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } .btn:active, .ico:active, .cat:active, .vol:active, button.chip:active { transform: none !important; } }
/* Depth of field (owner 2026-11-11): while a sheet, picker list, long-press menu or dialog is open, the page behind it
   (#app, inert meanwhile) steps back: dimmed, scaled to .97 round the middle of the screen (--dof-y, set when it turns
   inert) and blurred 2px. The blur is set once, never animated, and never scrolls: the root stops scrolling while #app
   is inert. The open layer lives outside #app, so it stays sharp. Low-end phones (:root.lowfx, ≤4 cores or ≤2 GB) get
   scale and dim only; reduced motion gets the dim only. */
:root:has(> body > #app[inert]) { overflow: hidden; }
#app[inert] { opacity: .85; }
@media (prefers-reduced-motion: no-preference) {
  #app { transition: transform var(--dur-in) var(--ease-out), opacity var(--dur-in) var(--ease-out); }
  #app[inert] { transform: scale(.97); transform-origin: 50% var(--dof-y, 50vh); }
  :root:not(.lowfx) #app[inert] { filter: blur(2px); }
}

/* Motion (hati-motion with hati-design): manga ink, not app-store bounce. Only transform and opacity move, plus
   clip-path on two small things (the toast and the sync words). Every animation is inside no-preference, and JS makes
   no ghosts or rolls under reduced motion (motionOn), so reduced motion gets none. Nothing waits for an animation:
   state, focus and taps belong to the new screen from its first frame.
   - Screen change: the old page is cut out as a slanted panel and slides off, speed lines behind it; forward it leaves
     to the left, Back to the right. It is a ghost (see turn()) that ignores taps; the new page is live under it.
   - Lists ink in: a paper cover with an ink edge sweeps off each row, 30 ms apart, the 7th row on all together.
   - Clay squashes on the way down. Sheets come up from the thumb edge and go back down. Balances roll. */
.ghost { position: fixed; inset: 0; pointer-events: none; contain: size layout style; } /* no paint containment: it would clip the panel to the moving host */
.ghost.screen { z-index: 5; }
.ghost.layer { z-index: 19; }
.gdim { position: fixed; inset: 0; background: var(--scrim); }
.gw { position: absolute; top: 0; left: 0; height: 100%; overflow: hidden; background: var(--bg); transform-origin: 0 0; transform: skewX(-8deg); }
.gw::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 3px; background: var(--fg); }
.back .gw::after { right: auto; left: 0; }
.gin { height: 100%; overflow: hidden; transform-origin: 0 0; transform: skewX(8deg); }
.gin > #app { transform: translateY(calc(-1px * var(--gy, 0))); }
.gin .topbar { position: relative; top: calc(1px * var(--gy, 0)); }
.gl { position: absolute; top: 0; height: 100%; width: 72px; transform-origin: 0 0; transform: skewX(-8deg);
  background: repeating-linear-gradient(180deg, var(--fg) 0 2px, transparent 2px 13px), repeating-linear-gradient(180deg, transparent 0 6px, var(--fg) 6px 7px, transparent 7px 19px) 0 0 / 55% 100% no-repeat;
  -webkit-mask-image: linear-gradient(to right, #000, transparent); mask-image: linear-gradient(to right, #000, transparent); }
.back .gl { background-position: 0 0, 100% 0; -webkit-mask-image: linear-gradient(to left, #000, transparent); mask-image: linear-gradient(to left, #000, transparent); }
@media (prefers-reduced-motion: no-preference) {
  /* Clay squash: down in 90 ms, flattening on the way (1.03 x .94, about the same area), landing pushed in.
     No transform transition on the way down (it would hide the squash); the release eases back over 160 ms. */
  .btn, .ico, .cat, .vol, button.chip:not(.add) { transition: transform var(--dur-out) var(--ease-out); }
  :is(.btn:not(.quiet):not(.text):not(:disabled), .ico, .cat, .vol, button.chip:not(.add)):active { transition: none; animation: squash var(--dur-press) var(--ease-out); }
  @keyframes squash { 0% { transform: none; } 55% { transform: translate(calc(var(--c-lift) * .67), calc(var(--c-lift) * .67)) scale(1.03, .94); } 100% { transform: translate(var(--c-lift), var(--c-lift)); } }

  /* Lists ink in on a screen change: the frame is drawn first, then a paper cover with an ink edge is wiped off the row
     (scaleX on a pseudo-element: compositor only, the row's box and taps never change). render() marks the first 12 rows
     of each list .ink (.ink-l: from the left, on Back) in that frame; a class on the rows themselves, not an attribute on
     #app, so only those rows are restyled, not every element of the page (100 history rows used to be). */
  /* Rows past the 12th are below the fold: they are simply there (no pseudo-element to style, nothing to wait for) */
  #app .ink, .sheet .share-sum, .tx.ink-new { position: relative; }
  #app .ink::after, .sheet .share-sum::after, .tx.ink-new::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: linear-gradient(to right, var(--fg) 0 3px, var(--cover, var(--panel)) 3px); transform-origin: right;
    animation: ink-off var(--dur-in) var(--ease-out) both;
  }
  /* 30 ms apart, set on the pseudo-element only: a custom property on each row would be inherited by its whole subtree
     and cost every row its shared style */
  #app .ink:nth-child(2)::after { animation-delay: calc(1 * var(--stagger)); }
  #app .ink:nth-child(3)::after { animation-delay: calc(2 * var(--stagger)); }
  #app .ink:nth-child(4)::after { animation-delay: calc(3 * var(--stagger)); }
  #app .ink:nth-child(5)::after { animation-delay: calc(4 * var(--stagger)); }
  #app .ink:nth-child(6)::after { animation-delay: calc(5 * var(--stagger)); }
  #app .ink:nth-child(n+7)::after { animation-delay: calc(6 * var(--stagger)); }
  #app .ink:is(.stack > .dashed, .chips > .add)::after { --cover: var(--bg); }
  #app .ink.ink-l::after { background: linear-gradient(to left, var(--fg) 0 3px, var(--cover, var(--panel)) 3px); transform-origin: left; }
  @keyframes ink-off { to { transform: scaleX(0); } }
  /* Press and hold a volume card: an ink wash fills it from the left over the hold (450 ms = HOLD_MS, linear: it is the
     hold itself, so it tracks the finger like a progress bar, rule 14); lifting early drops it at once. */
  .vol::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: inherit; background: color-mix(in srgb, var(--fg) 18%, transparent); transform-origin: left; transform: scaleX(0); visibility: hidden; }
  .vol.holding::before { visibility: visible; animation: hold-ink 450ms linear forwards; }
  @keyframes hold-ink { to { transform: scaleX(1); } }
  /* Empty states: the kaomoji lands like a stamp */
  #app .kao.ink-stamp { animation: stamp var(--dur-in) var(--ease-out) 60ms both; }
  @keyframes stamp { from { opacity: 0; transform: scale(1.5) rotate(-8deg); } 40% { opacity: 1; } }
  /* A live sync arrival: the new row is washed in the accent, then the wash is wiped off */
  .tx.ink-new::after { --cover: var(--accent); animation-delay: 60ms; animation-duration: 260ms; animation-timing-function: var(--ease-in-out); }

  /* Number roll: the new figure rolls in, the old one (data-was) rolls out; up when the amount grows, down when it shrinks.
     The old figure is drawn only: its alt text is empty, so a screen reader reads the new amount alone. */
  .amt.roll > .fig { animation: roll-in var(--dur-in) var(--ease-out) both; }
  .amt.roll::before { content: attr(data-was); content: attr(data-was) / ""; position: absolute; left: 0; top: 0; white-space: nowrap; pointer-events: none; animation: roll-out var(--dur-out) var(--ease-in) both; }
  .amt.roll.down > .fig { animation-name: roll-in-down; }
  .amt.roll.down::before { animation-name: roll-out-down; }
  .vol-bal.roll { animation: roll-in var(--dur-in) var(--ease-out) 120ms both; }
  @keyframes roll-in { from { opacity: 0; transform: translateY(45%); } }
  @keyframes roll-out { to { opacity: 0; transform: translateY(-45%); } }
  @keyframes roll-in-down { from { opacity: 0; transform: translateY(-45%); } }
  @keyframes roll-out-down { to { opacity: 0; transform: translateY(45%); } }
  /* Settle-up done: one ink pulse round the balance (rule 8); settled in full, the words land like a stamp, the one
     place a small overshoot is allowed (rule 13) */
  .hero.done::before { content: ""; position: absolute; inset: 5px; border: 3px solid var(--fg); border-radius: var(--r); pointer-events: none; animation: pulse 280ms var(--ease-out) both; }
  @keyframes pulse { from { opacity: 1; transform: scale(.97); } to { opacity: 0; transform: scale(1.01); } }
  .hero.done .k.stamped { transform-origin: 0 50%; animation: stamp var(--dur-in) cubic-bezier(.3, 1.45, .5, 1) both; }

  /* Sheets come up from the thumb edge; the page dims at once, like a panel cut (fading the scrim would fade the sheet
     inside it too). layerOut() takes them back down while the dim fades. The summary inks in and the QR prints top to
     bottom in 11 line feeds (steps: few repaints). */
  .sheet { animation: sheet-up var(--dur-in) var(--ease-out); }
  @keyframes sheet-up { from { transform: translateY(100%); } }
  /* the band starts a screen lower and arrives with the sheet, behind it all the way (no beat of its own) */
  .scrim::before { animation: band-up var(--dur-in) var(--ease-out); }
  @keyframes band-up { from { transform: translateY(100vh); } }
  .sheet .share-sum::after { animation-delay: 90ms; }
  .sheet .qr { animation: qr-print 220ms steps(11, end) 60ms both; }
  @keyframes qr-print { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }

  /* Toasts: a brush stroke in from the left, wiped off to the right */
  .toast { animation: toast-in var(--dur-in) var(--ease-out); }
  .toast.out { animation: toast-out var(--dur-out) var(--ease-in) forwards; }
  @keyframes toast-in { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(-6px); } }
  @keyframes toast-out { from { clip-path: inset(-6px); } to { clip-path: inset(-6px -6px -6px 100%); } }

  /* Live sync status: the square stamps, the words ink in (only when they change) */
  .sync.in i { animation: stamp 180ms var(--ease-out); }
  .sync.in span { animation: ink-write 180ms var(--ease-out); }
  @keyframes ink-write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }
}

/* ── MATTE GLASS (owner 2026-11-12: "use the new design in the upcoming APK") ─────────────────────────────────
   Replaces the ink-and-clay materials; layout, type and markup stay. One light, from above.
   Page: calm two-tone paper (two plate tints, one soft diagonal), no art behind the glass.
   Slab (owner's reference image, 2026-11-12): a clear matte pane, big round corners, a 1px lit top edge and a light

function computeSplits() {
  const f = ui.form, v = vol(), amount = parseMoney(f.amount);
  const ids = v.members.filter(m => f.include[m.id]).map(m => m.id);
  if (isNaN(amount)) return { error: "Use numbers like 12.50 (up to 2 decimals)." };
  if (!(amount > 0)) return { error: "Enter an amount greater than zero." };
  if (amount > MAX_CENTS) return { error: "That amount is too large." };
  if (!ids.length) return { error: "Pick at least one person to split with." };
  if (f.splitType === "equal") return { splits: splitEqual(amount, ids), amount };
  if (f.splitType === "exact") {
    const out = {}; let sum = 0;
    for (const id of ids) { const c = parseMoney(f.inputs[id] || "0"); if (isNaN(c)) return { error: `Check the amount for ${meName(v, id)}.` }; out[id] = c; sum += c; }
    if (sum !== amount) return { error: sum < amount ? `Exact amounts add up to ${fmt(sum, v.currency)}; ${fmt(amount - sum, v.currency)} left to assign.` : `Exact amounts add up to ${fmt(sum, v.currency)}; that's ${fmt(sum - amount, v.currency)} over.`, partial: out, amount };
    return { splits: out, amount };
  }
  const w = {};
  for (const id of ids) { const x = parseWeight(f.inputs[id] || ""); if (isNaN(x)) return { error: `Check the ${f.splitType === "percent" ? "percent" : "shares"} for ${meName(v, id)}.` }; w[id] = x; }
  const W = Object.values(w).reduce((a, b) => a + b, 0);
  if (f.splitType === "percent" && Math.round(W * 100) !== 10000) return { error: `Percentages add up to ${W.toFixed(2)}%; they need to total 100%.` };
  if (W <= 0) return { error: "Give at least one person a share." };
  return { splits: splitWeighted(amount, w), amount };
}

// ── Repeat entry (D1): a new expense learns from this volume's past ones ──
// Nothing is stored for this: the suggestions are read from the expenses themselves, on this phone.
function pastExpenses(v, q) {
  const by = new Map();
  v.expenses.forEach((e, i) => {
    const k = String(e.desc || "").trim().toLowerCase(); if (!k) return;
    const x = by.get(k) || { n: 0, e: null, key: "" }, key = `${e.date || ""}|${String(e.upd || 0).padStart(15, "0")}|${String(i).padStart(6, "0")}`;

// ── Undo (N5, D2): put entries back as they were, as a normal write with a fresh `upd`, so every phone takes it. ──

  const pb = ev.target.closest && ev.target.closest("hati-pick .pick-btn"); if (pb) return pickSheet(pb.closest("hati-pick"));
  const qh = ev.target.closest && ev.target.closest(".field [data-how]");
  if (qh) { const i = qh.closest(".field").querySelector("input"); if (!i) return; const on = qh.getAttribute("aria-pressed") === "true"; i.value = on ? "" : qh.dataset.how; paintHow(i); i.dispatchEvent(new Event("input", { bubbles: true })); return; }
  const qd = ev.target.closest && ev.target.closest(".field [data-day]");
  if (qd) { const i = qd.closest(".field").querySelector("input[type=date]"); if (!i) return; i.value = dayAgo(+qd.dataset.day); ["input", "change"].forEach(t => i.dispatchEvent(new Event(t, { bubbles: true }))); return; }
  const el = ev.target.closest("[data-act],[data-pal],[data-set]"); if (!el) return;
  if (el.dataset.pal) return selectPalette(el.dataset.pal);
  if (el.dataset.set) {
    S.settings[el.dataset.set] = el.dataset.val; commit(); applyTheme(); render();
    const b = $(`[data-set="${el.dataset.set}"][data-val="${el.dataset.val}"]`); if (b) b.focus();
    return;
  }
  const a = el.dataset.act, v = vol();
  // An archived volume is read-only: nothing that would change it runs (its screen doesn't offer these either).
  if (v && v.archived && ui.view !== "hub" && ["addExpense", "editExpense", "settle", "editSettle", "editMember", "removeMember", "addMember", "editVolume", "share", "deleteExpense", "deleteSettle", "selStart", "selRow", "selApply"].includes(a)) return;
  switch (a) {
    case "volActs": volActsSheet(el.dataset.id, el); break;
    case "editVol": { const x = volById(el.dataset.id); if (x && !x.archived) volumeSheet(x); break; }
    case "archive": archiveVolume(el.dataset.id); break;
    case "unarchive": unarchiveVolume(el.dataset.id); break;
    case "delVol": deleteVolume(el.dataset.id); break;
    case "home": if (ui.view !== "hub" || sheetOpen()) go("hub"); break;
    case "settings": if (ui.view !== "settings" || sheetOpen()) go("settings"); break;
    case "back": leave(); break;
    case "open": ui.volId = el.dataset.id; go("volume"); break;
    case "closeSheet": closeSheet(); break;
    case "newVolume": volumeSheet(null); break;
    case "editVolume": volumeSheet(v); break;
    case "volMenu": volMenuSheet(); break;
    case "share": shareSheet(); break;
    case "import": importSheet(); break;
    case "restore": importSheet({ restore: true }); break;
    case "dismissRecovered": recovered = false; render(); break;
    case "dismissIosHint": try { localStorage.setItem(IOS_HINT, "1"); } catch (e) {} el.closest("#iosHint").remove(); break;
    case "copyExpense": copyExpense(); break;
    case "more": ui.histLimit += 100; if ($("#histBody")) refreshHist(); else render(); break;
    case "histClear": ui.hf = null; ui.histLimit = 100; render(); { const q = $("#h-q"); if (q) q.focus(); } announce("Filter cleared"); break;
    case "selStart": ui.sel = new Set(); ui.selVol = v.id; render(); { const r = $("#app .ledger.hist .tx"); if (r) r.focus(); } announce("Tap the ones to change, then pick a date."); break;
    case "selRow": if (ui.sel) selToggle(el); break;
    case "selCancel": ui.sel = null; render(); { const b = $("#app [data-act=selStart]"); if (b) b.focus(); } break;
    case "selApply": if (ui.sel) applyDates(); break;
    case "sendCode": {
      const send = sendFn(); if (!send) { await copyShareCode(); break; }
      try { await send({ title: `HATI² · ${v.title}`, text: $("#s-code").value }); }
      catch (e) { if (!(e && e.name === "AbortError")) await copyShareCode(); }
      break;
    }
    case "copyCode": await copyShareCode(); break;
    case "sendLink": {
      const send = sendFn(); if (!send) { await copyShareLink(); break; }
      try { await send({ title: `HATI² · ${v.title}`, url: shareLink }); }
      catch (e) { if (!(e && e.name === "AbortError")) await copyShareLink(); }
      break;
    }
    case "copyLink": await copyShareLink(); break;
    case "deleteVolume": deleteVolume(v.id); break;
    case "addMember": if (sheetOpen()) dropSheet(); memberSheet(); break;
    case "addExpense": openExpense(null); break;
    case "editExpense": openExpense(v.expenses.find(e => e.id === el.dataset.id)); break;
    case "deleteExpense": confirmSheet("Delete expense?", `${ui.form.desc || "This expense"} will be removed and balances recalculated.`, "Delete", () => { const was = v.expenses.find(e => e.id === ui.form.id); v.expenses = v.expenses.filter(e => e.id !== ui.form.id); tombstone(v, ui.form.id); if (!commit()) return; leave(); toast("Expense deleted", was ? { undo: () => undoSteps(v.id, [{ list: "expenses", id: was.id, was, upd: 0 }]), ms: 6000 } : {}); }); break;
    case "settle": settleSheet(null); break;
    case "editSettle": settleSheet(v.settlements.find(s => s.id === el.dataset.id)); break;
    case "deleteSettle": { const id = el.dataset.id; confirmSheet("Delete payment?", "This payment will be removed and balances recalculated.", "Delete", () => { const was = v.settlements.find(s => s.id === id); v.settlements = v.settlements.filter(s => s.id !== id); tombstone(v, id); if (!commit()) return; closeSheet(); render(); toast("Payment deleted", was ? { undo: () => undoSteps(v.id, [{ list: "settlements", id, was, upd: 0 }]), ms: 6000 } : {}); }); break; }
    case "editMember": { const m = v.members.find(x => x.id === el.dataset.id); if (m) editMemberSheet(m); break; }
    case "removeMember": removeMember(el.dataset.id); break;
    case "backup": await downloadBackup(); break;
    case "history": go("history"); break;
    case "seed": S.volumes.unshift(exampleVolume()); if (!commit()) break; render(); toast("Example volume added"); break;
    case "reset": confirmSheet("Erase all data?", "Every volume on this device will be deleted. Copies shared to other phones are not affected.", "Erase", () => { S.volumes = []; if (!commit()) return; go("hub", { replace: true }); toast("All data erased"); }); break;
  }
});
document.addEventListener("input", ev => {
  if (ev.target.type === "date") paintDays(ev.target);
  if (ev.target.id === "s-via") paintHow(ev.target);
  const t = ev.target, v = ui.view === "history" && vol();
  if (v && (t.id === "h-q" || t.id === "h-who" || t.id === "h-cat")) {
    const hf = histFilter(v); hf[t.id === "h-q" ? "q" : t.id === "h-who" ? "who" : "cat"] = t.value; ui.histLimit = 100; refreshHist();
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && sheetOpen()) { closeSheet(); return; }
  eatClick = false;
  // A picker row is a radio group: arrows (and Home/End) move the choice and the focus together, wrapping around.
  const rb = ev.target.closest && ev.target.closest("hati-pick [role=radio]");
  if (rb && ["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight", "Home", "End"].includes(ev.key)) {
    ev.preventDefault();
    const all = [...rb.closest("hati-pick").querySelectorAll("[role=radio]")], i = all.indexOf(rb), n = all.length;
    const t = all[ev.key === "Home" ? 0 : ev.key === "End" ? n - 1 : (i + (ev.key === "ArrowDown" || ev.key === "ArrowRight" ? 1 : -1) + n) % n];
    rb.closest("hati-pick").choose(t.dataset.pv); t.focus(); return;
  }
  const card = (ev.key === "ContextMenu" || (ev.shiftKey && ev.key === "F10")) && ev.target.closest && ev.target.closest("#app .vol[data-id]");
  if (card) { ev.preventDefault(); if (!sheetOpen()) volActsSheet(card.dataset.id, card); return; }
  const p = ev.target.closest && ev.target.closest("[data-pal]");
  if (p && ["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight"].includes(ev.key)) {
    ev.preventDefault();
    const i = PALETTES.findIndex(x => x.id === p.dataset.pal), d = ev.key === "ArrowDown" || ev.key === "ArrowRight" ? 1 : -1;
    selectPalette(PALETTES[(i + d + PALETTES.length) % PALETTES.length].id);
  }
});
addEventListener("storage", ev => {
  if (ev.key === SYNC_KEY) { const disk = loadSync(); for (const id of Object.keys(disk)) if (!SY[id] && !forgotten.has(id)) { SY[id] = disk[id]; syncRun(id); wsOpen(id); } return; }
  if (ev.key !== KEY || ev.newValue === null) return;
  const fresh = load(); if (!fresh) return;
  S = fresh; applyTheme();
  if ($("#pickLayer")) $("#pickLayer").close(null);
  if (sheetOpen()) { dropSheet(); toast("Updated from another tab"); }
  if (ui.view === "expense") { goneElsewhere(); return; }
  if (!vol() && ui.view !== "hub" && ui.view !== "settings") ui.view = "hub";
  render();
});
addEventListener("hashchange", joinFromHash);
// The Archived shelf on the hub stays open or closed across redraws (this page only).
document.addEventListener("toggle", ev => { if (ev.target.id === "archBox") ui.archOpen = ev.target.open; }, true);
if (window.matchMedia) { const mq = matchMedia("(prefers-color-scheme: dark)"); mq.addEventListener && mq.addEventListener("change", () => applyTheme()); }
if (window.visualViewport) { const vv = () => document.documentElement.style.setProperty("--vvh", visualViewport.height + "px"); visualViewport.addEventListener("resize", vv); vv(); }

applyTheme();
try { history.replaceState({ depth: depth() }, ""); } catch (e) {}
const joinAtStart = location.hash.startsWith("#join=");
applyRoute();
if (!joinAtStart && hashFor() !== (location.hash || "")) setUrl(true);
render();
if (joinAtStart) joinFromHash();
// Live sync: push the outbox and catch up at start, when the network comes back and when the app is shown again.
// A hidden page closes its sockets (phones kill them anyway); the next visible one reopens them and pulls.
addEventListener("online", syncAll);
addEventListener("offline", () => Object.keys(SY).forEach(id => { wsClose(id); setSync(id, "off"); }));
document.addEventListener("visibilitychange", () => { if (document.hidden) Object.keys(SY).forEach(wsClose); else syncAll(); });
syncAll();
// Motion: read the timing tokens and build the ghost styles once the app is idle, not in the first tap. One throwaway
// ghost is styled off screen, so the browser has already compiled the ghost's rules when the first wipe needs them.
setTimeout(() => {
  if (!motionOn()) return;
  motionTimes(); const g = ghost("warm", ""); if (!g) return;
  g.host.style.left = "-200vw"; g.root.innerHTML = '<main id="app"><header class="topbar"><h1>x</h1></header><div class="hero"><div class="amt">0</div></div></main>';
  document.body.append(g.host); getComputedStyle(g.root.querySelector(".amt")).color; dropGhost("warm");
}, 400);

if ("serviceWorker" in navigator && window.isSecureContext) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
